<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ju5tFun Cloud</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f5f7fb;
    color: #172033;
}


/* =========================================================
   VARIABLES
========================================================= */

:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;

    --text: #172033;
    --muted: #788195;

    --border: #e7eaf0;
    --card: #ffffff;
    --bg: #f5f7fb;

    --danger: #ef4444;
    --success: #16a34a;

    --radius: 18px;
}


/* =========================================================
   COMMON
========================================================= */

.hidden {
    display: none !important;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}


/* =========================================================
   AUTH
========================================================= */

.auth-page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background:
        radial-gradient(
            circle at top left,
            #e8eaff 0,
            transparent 38%
        ),
        radial-gradient(
            circle at bottom right,
            #e0e7ff 0,
            transparent 35%
        ),
        #f7f8fc;
}

.auth-card {
    width: 100%;
    max-width: 410px;

    background: rgba(255,255,255,.94);

    border: 1px solid rgba(255,255,255,.8);

    border-radius: 28px;

    padding: 34px;

    box-shadow:
        0 25px 70px rgba(35,43,70,.12);
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;

    margin-bottom: 30px;
}

.brand-logo {
    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    color: white;

    font-size: 24px;

    box-shadow:
        0 10px 25px rgba(99,102,241,.25);
}

.brand-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.brand-subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
}

.auth-title {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 7px;
}

.auth-description {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
}

.field {
    margin-bottom: 14px;
}

.field label {
    display: block;

    font-size: 12px;
    font-weight: 700;

    color: #596276;

    margin-bottom: 7px;
}

.field input {
    width: 100%;

    height: 48px;

    padding: 0 14px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: #fafbfe;

    outline: none;

    transition: .18s;
}

.field input:focus {
    border-color: var(--primary);

    background: white;

    box-shadow:
        0 0 0 4px rgba(99,102,241,.09);
}

.primary-button {
    width: 100%;

    height: 48px;

    border: 0;
    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color: white;

    font-weight: 750;

    transition: .18s;

    box-shadow:
        0 8px 20px rgba(79,70,229,.2);
}

.primary-button:hover {
    transform: translateY(-1px);
}

.auth-switch {
    text-align: center;

    color: var(--muted);

    font-size: 13px;

    margin-top: 19px;
}

.link-button {
    border: 0;
    background: none;

    color: var(--primary);

    font-weight: 750;

    padding: 0 3px;
}

.message {
    padding: 11px 13px;

    border-radius: 11px;

    font-size: 13px;

    margin-top: 14px;
}

.message.error {
    background: #fef2f2;
    color: #b91c1c;
}

.message.success {
    background: #f0fdf4;
    color: #15803d;
}


/* =========================================================
   APP
========================================================= */

.app {
    min-height: 100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    height: 72px;

    display: flex;
    align-items: center;

    background: rgba(255,255,255,.9);

    border-bottom: 1px solid var(--border);

    position: sticky;
    top: 0;

    z-index: 20;

    backdrop-filter: blur(14px);
}

.header-inner {
    width: min(1180px, calc(100% - 32px));

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.header-brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.header-logo {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background: linear-gradient(
        135deg,
        #6366f1,
        #8b5cf6
    );

    color: white;

    font-size: 19px;
}

.header-title {
    font-weight: 800;
    font-size: 16px;
}

.header-user {
    color: var(--muted);
    font-size: 11px;

    max-width: 260px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.logout {
    border: 1px solid var(--border);

    background: white;

    color: #4b5563;

    padding: 9px 13px;

    border-radius: 10px;

    font-size: 12px;

    font-weight: 700;
}

.logout:hover {
    background: #f8fafc;
}


/* =========================================================
   MAIN
========================================================= */

.main {
    width: min(1180px, calc(100% - 32px));

    margin: auto;

    padding: 30px 0 60px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 24px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(25px, 4vw, 34px);

    letter-spacing: -1px;
}

.hero p {
    margin: 7px 0 0;

    color: var(--muted);

    font-size: 14px;
}

.file-count {
    white-space: nowrap;

    padding: 8px 12px;

    border-radius: 999px;

    background: #eef2ff;

    color: #4f46e5;

    font-size: 12px;

    font-weight: 750;
}


/* =========================================================
   UPLOAD
========================================================= */

.upload-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: 18px;

    margin-bottom: 22px;

    box-shadow:
        0 8px 30px rgba(20,28,50,.035);
}

.upload-zone {
    min-height: 150px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    border: 1.5px dashed #cdd3e0;

    border-radius: 14px;

    background: #fafbff;

    transition: .18s;

    cursor: pointer;
}

.upload-zone:hover,
.upload-zone.dragging {
    border-color: var(--primary);

    background: #f5f5ff;
}

.upload-icon {
    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    margin: 0 auto 10px;

    border-radius: 14px;

    background: #eef2ff;

    color: var(--primary);

    font-size: 22px;
}

.upload-title {
    font-size: 14px;

    font-weight: 800;
}

.upload-subtitle {
    color: var(--muted);

    font-size: 12px;

    margin-top: 4px;
}

.upload-limit {
    color: #9aa2b2;

    font-size: 11px;

    margin-top: 9px;
}

.upload-status {
    margin-top: 12px;

    font-size: 12px;

    color: var(--muted);

    min-height: 17px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 17px;
}

.search-box {
    flex: 1;

    position: relative;
}

.search-box span {
    position: absolute;

    left: 14px;
    top: 50%;

    transform: translateY(-50%);

    color: #9aa2b2;

    font-size: 15px;
}

.search-box input {
    width: 100%;

    height: 44px;

    padding:
        0 14px 0 39px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: white;

    outline: none;

    font-size: 13px;
}

.search-box input:focus {
    border-color: #b9bdfc;

    box-shadow:
        0 0 0 4px rgba(99,102,241,.07);
}

.refresh-button {
    width: 44px;
    height: 44px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: white;

    color: #596276;

    font-size: 17px;

    transition: .18s;
}

.refresh-button:hover {
    color: var(--primary);

    background: #fafaff;
}


/* =========================================================
   FILE GRID
========================================================= */

.file-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(235px, 1fr));

    gap: 14px;
}

.file-card {
    background: white;

    border: 1px solid var(--border);

    border-radius: 16px;

    overflow: hidden;

    transition:
        transform .18s,
        box-shadow .18s,
        border-color .18s;
}

.file-card:hover {
    transform: translateY(-2px);

    border-color: #d9dcf7;

    box-shadow:
        0 14px 30px rgba(25,32,55,.08);
}

.file-preview {
    height: 145px;

    background:
        linear-gradient(
            135deg,
            #f5f7ff,
            #f9fafc
        );

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;

    overflow: hidden;
}

.file-preview img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.file-type-icon {
    width: 56px;
    height: 56px;

    display: grid;
    place-items: center;

    border-radius: 17px;

    background: white;

    box-shadow:
        0 8px 22px rgba(20,30,60,.08);

    font-size: 27px;
}

.file-info {
    padding: 14px 14px 10px;
}

.file-name {
    font-size: 13px;

    font-weight: 750;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    color: #20283a;
}

.file-meta {
    margin-top: 5px;

    color: #929aab;

    font-size: 11px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.file-actions {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    padding:
        0 14px 14px;
}

.action {
    height: 34px;

    border-radius: 9px;

    border: 1px solid var(--border);

    background: #fafbfc;

    color: #596276;

    font-size: 11px;

    font-weight: 700;

    transition: .15s;
}

.action:hover {
    background: #f2f4f8;
}

.action.download:hover {
    color: var(--primary);
    border-color: #cdd1ff;
}

.action.rename:hover {
    color: #d97706;
    border-color: #fde68a;
}

.action.delete:hover {
    color: var(--danger);
    border-color: #fecaca;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
    grid-column: 1 / -1;

    padding: 65px 20px;

    text-align: center;

    background: white;

    border: 1px solid var(--border);

    border-radius: 18px;
}

.empty-icon {
    font-size: 38px;

    margin-bottom: 10px;

    opacity: .8;
}

.empty-title {
    font-size: 15px;

    font-weight: 800;
}

.empty-text {
    color: var(--muted);

    font-size: 12px;

    margin-top: 5px;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
    grid-column: 1 / -1;

    padding: 50px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

.spinner {
    width: 24px;
    height: 24px;

    margin: 0 auto 10px;

    border: 2px solid #e5e7eb;

    border-top-color: var(--primary);

    border-radius: 50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 100;

    min-width: 250px;
    max-width: calc(100% - 40px);

    padding: 13px 15px;

    border-radius: 12px;

    background: #172033;

    color: white;

    box-shadow:
        0 15px 40px rgba(0,0,0,.18);

    font-size: 12px;

    transform:
        translateY(20px);

    opacity: 0;

    pointer-events: none;

    transition: .2s;
}

.toast.show {
    transform: translateY(0);

    opacity: 1;
}

.toast.success {
    background: #15803d;
}

.toast.error {
    background: #b91c1c;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    .header {
        height: 64px;
    }

    .header-inner {
        width: min(
            100% - 22px,
            1180px
        );
    }

    .header-user {
        display: none;
    }

    .main {
        width: min(
            100% - 22px,
            1180px
        );

        padding-top: 22px;
    }

    .hero {
        align-items: flex-start;

        flex-direction: column;

        gap: 10px;
    }

    .file-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;
    }

    .file-preview {
        height: 115px;
    }

    .file-info {
        padding: 11px 11px 8px;
    }

    .file-actions {
        padding:
            0 11px 11px;

        gap: 5px;
    }

    .action {
        height: 32px;

        font-size: 10px;
    }

    .auth-card {
        padding: 27px 22px;

        border-radius: 23px;
    }
}

@media (max-width: 390px) {

    .file-grid {
        grid-template-columns: 1fr;
    }

    .file-preview {
        height: 150px;
    }
}
</style>
</head>

<script>
/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://jbrrlophgrdqniorjkjn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VxFQ1sUpf4-wjEpzhg4IMg_c_scLRSQ";

const BUCKET =
    "file-storage";

const MAX_FILE_SIZE =
    100 * 1024 * 1024;

const MAX_FILES =
    10;

const MAX_CONCURRENT_UPLOADS =
    10;


/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let allFiles = [];

let thumbnailCache =
    new Map();

let uploadRunning = false;


/* =========================================================
   ELEMENTS
========================================================= */

const authPage =
    document.getElementById("authPage");

const storagePage =
    document.getElementById("storagePage");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const fileGrid =
    document.getElementById("fileGrid");

const fileInput =
    document.getElementById("fileInput");

const uploadZone =
    document.getElementById("uploadZone");

const uploadStatus =
    document.getElementById("uploadStatus");

const searchInput =
    document.getElementById("searchInput");

const fileCount =
    document.getElementById("fileCount");

const toast =
    document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatSize(bytes) {

    bytes = Number(bytes) || 0;

    if (bytes < 1024)
        return bytes + " B";

    if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";

    if (bytes < 1024 * 1024 * 1024)
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";

    return (
        bytes /
        (1024 * 1024 * 1024)
    ).toFixed(1) + " GB";
}


function formatDate(date) {

    if (!date)
        return "-";

    return new Date(date)
        .toLocaleDateString(
            "id-ID",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
}


function getExtension(name) {

    const parts =
        name.split(".");

    if (parts.length < 2)
        return "";

    return parts
        .pop()
        .toLowerCase();
}


function isImage(file) {

    const type =
        file.metadata?.mimetype ||
        file.metadata?.contentType ||
        "";

    const ext =
        getExtension(file.name);

    return (
        type.startsWith("image/") ||
        [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp",
            "bmp",
            "svg"
        ].includes(ext)
    );
}


function getFileIcon(name) {

    const ext =
        getExtension(name);

    if (
        [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp",
            "bmp",
            "svg"
        ].includes(ext)
    )
        return "🖼️";

    if (
        [
            "mp4",
            "mkv",
            "mov",
            "avi",
            "webm"
        ].includes(ext)
    )
        return "🎬";

    if (
        [
            "mp3",
            "wav",
            "ogg",
            "m4a"
        ].includes(ext)
    )
        return "🎵";

    if (
        [
            "pdf"
        ].includes(ext)
    )
        return "📕";

    if (
        [
            "doc",
            "docx"
        ].includes(ext)
    )
        return "📘";

    if (
        [
            "xls",
            "xlsx",
            "csv"
        ].includes(ext)
    )
        return "📗";

    if (
        [
            "zip",
            "rar",
            "7z"
        ].includes(ext)
    )
        return "📦";

    if (
        [
            "js",
            "html",
            "css",
            "json",
            "php",
            "py"
        ].includes(ext)
    )
        return "💻";

    return "📄";
}

let toastTimer;

function showToast(
    message,
    type = ""
) {

    clearTimeout(toastTimer);

    toast.textContent =
        message;

    toast.className =
        "toast show " + type;

    toastTimer =
        setTimeout(() => {

            toast.className =

========================================================= */

    element,
    message,
    type = "error"
) {

    element.textContent =

/* =========================================================
   LOGIN
========================================================= */

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        login
    );


async function login() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const message =
        document
            .getElementById("loginMessage");

    if (!email || !password) {

        showAuthMessage(
            message,
            "Email dan password wajib diisi."
        );

        return;
    }

    const button =
        document
            .getElementById("loginButton");

    button.disabled = true;

    button.textContent =
        "Login...";

    const {
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({
                email,
                password
            });

    button.disabled = false;

    button.textContent =
        "Login";

    if (error) {

        showAuthMessage(
            message,
            error.message
        );

        return;
    }

    message.className =
        "message hidden";
}


/* =========================================================
   REGISTER
========================================================= */

document
    .getElementById("registerButton")
    .addEventListener(
        "click",
        register
    );


async function register() {

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const message =
        document
            .getElementById("registerMessage");

    if (!email || !password) {

        showAuthMessage(
            message,
            "Email dan password wajib diisi."
        );

        return;
    }

    if (password.length < 6) {

        showAuthMessage(
            message,
            "Password minimal 6 karakter."
        );

        return;
    }

    const button =
        document
            .getElementById("registerButton");

    button.disabled = true;

    button.textContent =
        "Membuat akun...";

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signUp({
                email,
                password
            });

    button.disabled = false;

    button.textContent =
        "Buat Akun";

    if (error) {

        showAuthMessage(
            message,
            error.message
        );

        return;
    }

    if (!data.session) {

        showAuthMessage(
            message,
            "Akun berhasil dibuat. Silakan cek email untuk verifikasi.",
            "success"
        );

        return;
    }

/* =========================================================
   LOAD FILES
========================================================= */

async function loadFiles() {

    if (!currentUser)
        return;

    fileGrid.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Memuat file...
        </div>
    `;

    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from(BUCKET)
            .list(
                currentUser.id,
                {
                    limit: 1000,
                    sortBy: {
                        column: "created_at",
                        order: "desc"
                    }
                }
            );

    if (error) {

        console.error(error);

        fileGrid.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <div class="empty-title">
                    Gagal memuat file
                </div>
                <div class="empty-text">
                    ${escapeHtml(error.message)}
                </div>
            </div>
        `;

        return;
    }

    allFiles =
        (data || [])
            .filter(
                file => file.name
            );

    fileCount.textContent =
        `${allFiles.length} file`;

    renderFiles(
        allFiles
    );

    /*
       Thumbnail dibuat setelah card selesai
       sehingga tampilan utama tidak menunggu.
    */
    loadThumbnails(
        allFiles
    );
}


/* =========================================================
   RENDER FILES
========================================================= */

function renderFiles(files) {

    fileGrid.innerHTML = "";

    if (!files.length) {

        fileGrid.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ☁️
                </div>

                <div class="empty-title">
                    Belum ada file
                </div>

                <div class="empty-text">
                    Upload file pertama kamu di area upload.
                </div>

            </div>
        `;

        return;
    }


    const fragment =
        document.createDocumentFragment();


    files.forEach(
        file => {

            const card =
                document.createElement("article");

            card.className =
                "file-card";


            const name =
                escapeHtml(
                    file.name
                );

            const size =
                formatSize(
                    file.metadata?.size
                );

            const date =
                formatDate(
                    file.created_at
                );


            card.innerHTML = `

                <div
                    class="file-preview"
                    data-preview
                >

                    <div class="file-type-icon">
                        ${getFileIcon(file.name)}
                    </div>

                </div>


                <div class="file-info">

                    <div
                        class="file-name"
                        title="${name}"
                    >
                        ${name}
                    </div>

                    <div class="file-meta">
                        ${size} • ${date}
                    </div>

                </div>


                <div class="file-actions">

                    <button
                        class="action download"
                        data-download
                    >
                        Download
                    </button>

                    <button
                        class="action rename"
                        data-rename
                    >
                        Rename
                    </button>

                    <button
                        class="action delete"
                        data-delete
                    >
                        Hapus
                    </button>

                </div>
            `;


            card
                .querySelector("[data-download]")
                .addEventListener(
                    "click",
                    () =>
                        downloadFile(
                            file.name
                        )
                );


            card
                .querySelector("[data-rename]")
                .addEventListener(
                    "click",
                    () =>
                        renameFile(
                            file.name
                        )
                );


            card
                .querySelector("[data-delete]")
                .addEventListener(
                    "click",
                    () =>
                        deleteFile(
                            file.name
                        )
                );


            card.dataset.fileName =
                file.name;


            fragment.appendChild(
                card
            );

        }
    );


    fileGrid.appendChild(
        fragment
    );
}


/* =========================================================
   THUMBNAILS
========================================================= */

async function loadThumbnails(files) {

    const imageFiles =
        files.filter(
            file =>
                isImage(file)
        );


    if (!imageFiles.length)
        return;


    const paths =
        imageFiles.map(
            file =>
                `${currentUser.id}/${file.name}`
        );


    /*
       Satu request batch untuk semua
       thumbnail, bukan request satu-satu.
    */

    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from(BUCKET)
            .createSignedUrls(
                paths,
                3600
            );


    if (error) {

        console.warn(
            "Thumbnail gagal:",
            error
        );

        return;
    }


    if (!data)
        return;


    data.forEach(
        (item, index) => {

            if (!item?.signedUrl)
                return;


            const file =
                imageFiles[index];


            if (!file)
                return;


            thumbnailCache.set(
                file.name,
                item.signedUrl
            );


            const card =
                Array.from(
                    fileGrid.children
                ).find(
                    element =>
                        element.dataset.fileName ===
                        file.name
                );


            if (!card)
                return;


            const preview =
                card.querySelector(
                    "[data-preview]"
                );


            if (!preview)
                return;


            const img =
                document.createElement("img");


            img.loading =
                "lazy";

            img.decoding =
                "async";

            img.alt =
                file.name;

            img.src =
                item.signedUrl;


            img.onload =
                () => {

                    preview.innerHTML = "";

                    preview.appendChild(
                        img
                    );

                };


            img.onerror =
                () => {

                    // tetap gunakan icon

                };

        }
    );
}

].forEach(

            eventName,

        );

);


/* =========================================================
   UPLOAD FILES
========================================================= */

async function uploadFiles(files) {

    if (!currentUser)
        return;


    if (uploadRunning) {

        showToast(
            "Upload sedang berjalan.",
            "error"
        );

        return;
    }


    if (!files.length)
        return;


    if (files.length > MAX_FILES) {

        showToast(
            `Maksimal ${MAX_FILES} file sekali upload.`,
            "error"
        );

        return;
    }


    const validFiles =
        files.filter(
            file =>
                file.size <= MAX_FILE_SIZE
        );


    if (validFiles.length !== files.length) {

        showToast(
            "Ada file yang lebih besar dari 100 MB.",
            "error"
        );

    }


    if (!validFiles.length)
        return;


    uploadRunning = true;

    uploadZone.style.pointerEvents =
        "none";


    let completed = 0;

    let failed = 0;


    uploadStatus.textContent =
        `Mempersiapkan ${validFiles.length} file...`;


    /*
       Worker pool.
       Maksimal 10 upload bersamaan.
    */

    let cursor = 0;


    async function worker() {

        while (true) {

            const index =
                cursor++;


            if (
                index >=
                validFiles.length
            )
                break;


            const file =
                validFiles[index];


            try {

                uploadStatus.textContent =
                    `Mengupload ${completed + failed + 1}/${validFiles.length}...`;


                const safeName =
                    file.name
                        .replace(
                            /[^a-zA-Z0-9._-]/g,
                            "_"
                        )
                        .replace(
                            /_+/g,
                            "_"
                        );


                const random =
                    Math.random()
                        .toString(36)
                        .slice(2, 8);


                const fileName =
                    `${Date.now()}_${random}_${safeName}`;


                const filePath =
                    `${currentUser.id}/${fileName}`;


                const {
                    error
                } =
                    await supabaseClient
                        .storage
                        .from(BUCKET)
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl: "3600",
                                upsert: false
                            }
                        );


                if (error)
                    throw error;


                completed++;

            } catch (error) {

                failed++;

                console.error(
                    "Upload error:",
                    error
                );

            }

        }

    }


    const workers =
        Math.min(
            MAX_CONCURRENT_UPLOADS,
            validFiles.length
        );


    await Promise.all(
        Array.from(
            {
                length: workers
            },
            worker
        )
    );


    uploadRunning = false;

    uploadZone.style.pointerEvents =
        "";


    if (failed) {

        showToast(
            `${completed} berhasil, ${failed} gagal.`,
            "error"
        );

    } else {

        showToast(
            `${completed} file berhasil diupload.`,
            "success"
        );

    }


    uploadStatus.textContent =
        "";


    await loadFiles();
}


/* =========================================================
   DOWNLOAD
========================================================= */

async function downloadFile(
    fileName
) {

    if (!currentUser)
        return;


    try {

        const filePath =
            `${currentUser.id}/${fileName}`;


        const {
            data,
            error
        } =
            await supabaseClient
                .storage
                .from(BUCKET)
                .createSignedUrl(
                    filePath,
                    3600
                );


        if (error)
            throw error;


        if (!data?.signedUrl)
            throw new Error(
                "URL download tidak tersedia."
            );


        window.open(
            data.signedUrl,
            "_blank"
        );


    } catch (error) {

        console.error(error);

        showToast(
            `Download gagal: ${error.message}`,
            "error"
        );

    }
}


/* =========================================================
   RENAME
========================================================= */

async function renameFile(
    oldName
) {

    if (!currentUser)
        return;


    const input =
        prompt(
            "Nama file baru:",
            oldName
        );


    if (input === null)
        return;


    const newName =
        input.trim();


    if (!newName) {

        showToast(
            "Nama file tidak boleh kosong.",
            "error"
        );

        return;
    }


    if (newName === oldName)
        return;


    const safeName =
        newName
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            )
            .replace(
                /_+/g,
                "_"
            );


    if (!safeName) {

        showToast(
            "Nama file tidak valid.",
            "error"
        );

        return;
    }


    if (safeName === oldName)
        return;


    const oldPath =
        `${currentUser.id}/${oldName}`;

    const newPath =
        `${currentUser.id}/${safeName}`;


    try {

        showToast(
            "Mengganti nama file..."
        );


        /*
           MOVE adalah cara utama.
           Policy UPDATE + SELECT sudah
           disiapkan di SQL.
        */

        const {
            error
        } =
            await supabaseClient
                .storage
                .from(BUCKET)
                .move(
                    oldPath,
                    newPath
                );


        if (error)
            throw error;


        thumbnailCache.delete(
            oldName
        );


        showToast(
            "Nama file berhasil diubah.",
            "success"
        );


        await loadFiles();


    } catch (error) {

        console.error(
            "Rename error:",
            error
        );


        showToast(
            `Rename gagal: ${error.message}`,
            "error"
        );

    }
}


/* =========================================================
   DELETE
========================================================= */

async function deleteFile(
    fileName
) {

    if (!currentUser)
        return;


    const confirmed =
        confirm(
            `Hapus "${fileName}"?`
        );


    if (!confirmed)
        return;


    try {

        const filePath =
            `${currentUser.id}/${fileName}`;


        const {
            error
        } =
            await supabaseClient
                .storage
                .from(BUCKET)
                .remove([
                    filePath
                ]);


        if (error)
            throw error;


        thumbnailCache.delete(
            fileName
        );


        showToast(
            "File berhasil dihapus.",
            "success"
        );


        await loadFiles();


    } catch (error) {

        console.error(error);

        showToast(
            `Hapus gagal: ${error.message}`,
            "error"
        );

    }
}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!keyword) {

            renderFiles(
                allFiles
            );

            loadThumbnails(
                allFiles
            );

            return;
        }


        const filtered =
            allFiles.filter(
                file =>
                    file.name
                        .toLowerCase()
                        .includes(keyword)
            );


        renderFiles(
            filtered
        );


        loadThumbnails(
            filtered
        );

    }
);

/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            if (
                session &&
                session.user
            ) {

                currentUser =
                    session.user;

                await showStoragePage();

            } else {

                currentUser =
                    null;

                allFiles = [];

                thumbnailCache.clear();

                storagePage
                    .classList
                    .add("hidden");

                authPage
                    .classList
                    .remove("hidden");

            }

        }
    );


/* =========================================================
   INITIAL SESSION
========================================================= */

async function init() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getSession();


    if (
        data?.session?.user
    ) {

        currentUser =
            data.session.user;

        await showStoragePage();

    }

}


init();
