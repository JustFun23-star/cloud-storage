<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Cloud Storage</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1e293b;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    .auth-logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 8px;
    }

    .auth-title {
      text-align: center;
      font-size: 23px;
      font-weight: 800;
    }

    .auth-subtitle {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin: 5px 0 22px;
    }

    .auth-input {
      width: 100%;
      padding: 12px 13px;
      margin-bottom: 10px;
      border: 1px solid #dbe1e8;
      border-radius: 10px;
      outline: none;
    }

    .auth-input:focus {
      border-color: #2563eb;
    }

    .auth-button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #2563eb;
      font-weight: 700;
    }

    .auth-button:hover {
      background: #1d4ed8;
    }

    .register-button {
      background: #059669;
    }

    .register-button:hover {
      background: #047857;
    }

    .switch-auth {
      text-align: center;
      margin-top: 17px;
      font-size: 13px;
      color: #64748b;
    }

    .switch-auth button {
      border: 0;
      background: transparent;
      color: #2563eb;
      font-weight: 700;
    }

    .auth-message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 9px;
      font-size: 13px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      min-width: 0;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
    }

    .brand-email {
      margin-top: 2px;
      font-size: 12px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      flex-shrink: 0;
      border: 0;
      border-radius: 9px;
      padding: 8px 12px;
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      max-width: 1000px;
      margin: auto;
      padding: 18px 16px 40px;
    }

    .box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    /* =========================
       UPLOAD
    ========================= */

    .upload-box {
      padding: 18px;
    }

    .title {
      font-size: 17px;
      font-weight: 800;
    }

    .description {
      color: #64748b;
      font-size: 12px;
      margin: 4px 0 14px;
    }

    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 13px;
      padding: 24px 15px;
      text-align: center;
      cursor: pointer;
      background: #fafcff;
    }

    .upload-area:hover,
    .upload-area.drag {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 7px;
    }

    .upload-text {
      font-size: 14px;
      font-weight: 700;
    }

    .upload-sub {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 4px;
    }

    .upload-limit {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
    }

    #uploadStatus {
      margin-top: 12px;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 12px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      padding: 10px;
    }

    .search-row {
      display: flex;
      gap: 7px;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #dbe1e8;
      border-radius: 10px;
      outline: none;
    }

    .search-input:focus {
      border-color: #2563eb;
    }

    .refresh-btn {
      width: 42px;
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 19px;
    }

    /* =========================
       FILE HEADER
    ========================= */

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .file-title {
      font-size: 17px;
      font-weight: 800;
    }

    .file-count {
      background: #e0e7ff;
      color: #4338ca;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       FILE LIST
    ========================= */

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-card {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
    }

    .file-card:hover {
      border-color: #cbd5e1;
    }

    /* Thumbnail kecil = lebih ringan */

    .thumbnail {
      width: 72px;
      height: 58px;
      flex: 0 0 72px;
      border-radius: 9px;
      overflow: hidden;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .file-icon {
      font-size: 28px;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-meta {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 10px;
    }

    .file-actions {
      flex-shrink: 0;
      display: flex;
      gap: 5px;
    }

    .action-btn {
      border: 0;
      border-radius: 8px;
      padding: 7px 8px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .rename-btn {
      background: #f59e0b;
    }

    .rename-btn:hover {
      background: #d97706;
    }

    .download-btn {
      background: #2563eb;
    }

    .download-btn:hover {
      background: #1d4ed8;
    }

    .delete-btn {
      background: #ef4444;
    }

    .delete-btn:hover {
      background: #dc2626;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .empty {
      padding: 40px 15px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }

    .empty-icon {
      font-size: 40px;
    }

    .empty-title {
      margin-top: 7px;
      font-weight: 700;
      color: #475569;
    }

    .empty-text {
      margin-top: 3px;
      font-size: 12px;
      color: #94a3b8;
    }

    .loading {
      padding: 25px;
      text-align: center;
      background: #fff;
      border-radius: 13px;
      color: #64748b;
      font-size: 12px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 720px) {

      .file-card {
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .file-info {
        padding-top: 1px;
      }

      .file-actions {
        width: 100%;
        padding-left: 83px;
      }
    }

    @media (max-width: 430px) {

      .main {
        padding-left: 10px;
        padding-right: 10px;
      }

      .header-inner {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand-title {
        font-size: 16px;
      }

      .brand-email {
        max-width: 180px;
      }

      .thumbnail {
        width: 62px;
        height: 52px;
        flex-basis: 62px;
      }

      .file-actions {
        padding-left: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .action-btn {
        width: 100%;
        font-size: 10px;
        padding: 7px 3px;
      }
    }
  </style>
</head>

<body>

<!-- =====================================================
     AUTH
===================================================== -->

<div id="authPage" class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">☁️</div>

    <div class="auth-title">

    <!-- LOGIN -->

        id="registerPassword"

        type="password"

        class="auth-button register-button"

</div>


<!-- =====================================================
     STORAGE
===================================================== -->

<div id="storagePage" class="hidden">

  <header class="header">

    <div class="header-inner">

      <div class="brand">

        <div class="brand-title">
          ☁️ My Cloud Storage
        </div>

        <div

      </div>

  <main class="main">

    <!-- UPLOAD -->

        Upload File

    <!-- FILE HEADER -->

  </main>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://jbrrlophgrdqniorjkjn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VxFQ1sUpf4-wjEpzhg4IMg_c_scLRSQ";

const BUCKET =
  "file-storage";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   SETTINGS
===================================================== */

const MAX_FILE_SIZE =
  100 * 1024 * 1024;

const MAX_FILES =
  10;

const MAX_CONCURRENT_UPLOADS =
  10;


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let allFiles = [];

let isUploading = false;


/*
  Cache thumbnail.

  Tidak perlu request ulang selama
  halaman masih terbuka.
*/

const thumbnailCache =
  new Map();


/* =====================================================
   ELEMENT
===================================================== */

const authPage =
  document.getElementById(
    "authPage"
  );

const storagePage =
  document.getElementById(
    "storagePage"
  );

const loginForm =
  document.getElementById(
    "loginForm"
  );

const registerForm =
  document.getElementById(
    "registerForm"
  );

const authMessage =
  document.getElementById(
    "authMessage"
  );

const fileInput =
  document.getElementById(
    "fileInput"
  );

const fileList =
  document.getElementById(
    "fileList"
  );

const emptyState =
  document.getElementById(
    "emptyState"
  );

const fileCount =
  document.getElementById(
    "fileCount"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const uploadStatus =
  document.getElementById(
    "uploadStatus"
  );

const uploadArea =
  document.getElementById(
    "uploadArea"
  );


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(value);

  return div.innerHTML;
}


/* =====================================================
   MESSAGE
===================================================== */

function showAuthMessage(
  message,
  type = "error"
) {

  authMessage.textContent =
    message;

  authMessage.classList.remove(
    "hidden"
  );

  authMessage.style.background =
    type === "success"
      ? "#dcfce7"
      : "#fee2e2";

  authMessage.style.color =
    type === "success"
      ? "#166534"
      : "#991b1b";
}


function showUploadMessage(
  message,
  type = "error"
) {

  uploadStatus.textContent =
    message;

  uploadStatus.classList.remove(
    "hidden"
  );

  uploadStatus.style.background =
    type === "success"
      ? "#dcfce7"
      : type === "loading"
        ? "#dbeafe"
        : "#fee2e2";

  uploadStatus.style.color =
    type === "success"
      ? "#166534"
      : type === "loading"
        ? "#1d4ed8"
        : "#991b1b";
}


/* =====================================================
   AUTH SWITCH
===================================================== */

document
  .getElementById("showRegister")
  .addEventListener(
    "click",
    () => {

      loginForm.classList.add(
        "hidden"
      );

      registerForm.classList.remove(
        "hidden"
      );

      authMessage.classList.add(
        "hidden"
      );
    }
  );


document
  .getElementById("showLogin")
  .addEventListener(
    "click",
    () => {

      registerForm.classList.add(
        "hidden"
      );

      loginForm.classList.remove(
        "hidden"
      );

      authMessage.classList.add(
        "hidden"
      );
    }
  );


/* =====================================================
   REGISTER
===================================================== */

document
  .getElementById("registerButton")
  .addEventListener(
    "click",
    async () => {

      const email =
        document
          .getElementById(
            "registerEmail"
          )
          .value
          .trim();

      const password =
        document
          .getElementById(
            "registerPassword"
          )
          .value;


      if (!email || !password) {

        showAuthMessage(
          "Email dan password harus diisi."
        );

        return;
      }


      if (password.length < 6) {

        showAuthMessage(
          "Password minimal 6 karakter."
        );

        return;
      }


      const button =
        document.getElementById(
          "registerButton"
        );


      button.disabled = true;

      button.textContent =
        "Mendaftarkan...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signUp({
              email,
              password
            });


        if (error)
          throw error;


        if (data.session) {

          currentUser =
            data.user;

          await showStorage();

        } else {

          showAuthMessage(
            "Akun berhasil dibuat. Silakan cek email untuk verifikasi.",
            "success"
          );

        }

      } catch (error) {

        console.error(error);

        showAuthMessage(
          error.message ||
          "Gagal membuat akun."
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Daftar";
      }

    }
  );


/* =====================================================
   LOGIN
===================================================== */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    async () => {

      const email =
        document
          .getElementById(
            "loginEmail"
          )
          .value
          .trim();

      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;


      if (!email || !password) {

        showAuthMessage(
          "Email dan password harus diisi."
        );

        return;
      }


      const button =
        document.getElementById(
          "loginButton"
        );


      button.disabled = true;

      button.textContent =
        "Login...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({
              email,
              password
            });


        if (error)
          throw error;


        currentUser =
          data.user;


        await showStorage();

      } catch (error) {

        console.error(error);

        showAuthMessage(
          error.message ||
          "Login gagal."
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Login";
      }

    }
  );


/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();

      currentUser = null;

      allFiles = [];

      thumbnailCache.clear();

      storagePage.classList.add(
        "hidden"
      );

      authPage.classList.remove(
        "hidden"
      );

      fileList.innerHTML = "";
    }
  );


/* =====================================================
   SHOW STORAGE
===================================================== */

async function showStorage() {

  authPage.classList.add(
    "hidden"
  );

  storagePage.classList.remove(
    "hidden"
  );


  document
    .getElementById(
      "userEmail"
    )
    .textContent =
    currentUser?.email || "";


  await loadFiles();
}


/* =====================================================
   FILE ICON
===================================================== */

function getFileIcon(
  fileName
) {

  const ext =
    fileName
      .split(".")
      .pop()
      .toLowerCase();


  if (
    [
      "jpg",
      "jpeg",
      "png",
      "gif",
      "webp",
      "svg"
    ].includes(ext)
  ) return "🖼️";


  if (
    [
      "mp4",
      "mov",
      "avi",
      "mkv",
      "webm"
    ].includes(ext)
  ) return "🎬";


  if (
    [
      "mp3",
      "wav",
      "ogg",
      "m4a"
    ].includes(ext)
  ) return "🎵";


  if (
    [
      "pdf"
    ].includes(ext)
  ) return "📕";


  if (
    [
      "doc",
      "docx",
      "txt"
    ].includes(ext)
  ) return "📄";


  if (
    [
      "xls",
      "xlsx"
    ].includes(ext)
  ) return "📊";


  if (
    [
      "zip",
      "rar",
      "7z"
    ].includes(ext)
  ) return "📦";


  return "📁";
}


/* =====================================================
   IMAGE CHECK
===================================================== */

function isImageFile(
  fileName
) {

  return /\.(jpg|jpeg|png|gif|webp|svg)$/i
    .test(fileName);
}


/* =====================================================
   SIZE
===================================================== */

function formatSize(
  bytes
) {

  if (!bytes)
    return "0 Bytes";


  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];


  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    parseFloat(
      (
        bytes /
        Math.pow(1024, i)
      ).toFixed(2)
    ) +
    " " +
    units[i]
  );
}


/* =====================================================
   DATE
===================================================== */

function formatDate(
  date
) {

  if (!date)
    return "-";


  return new Date(date)
    .toLocaleString(
      "id-ID",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );
}


/* =====================================================
   LOAD FILES

   HANYA 1 REQUEST UNTUK DAFTAR FILE.

   Tidak ada thumbnail request di sini.
===================================================== */

async function loadFiles() {

  if (!currentUser)
    return;


  /*
    Jangan menampilkan spinner
    setiap refresh jika file sudah ada.
  */

  if (!allFiles.length) {

    fileList.innerHTML = `
      <div class="loading">
        Memuat file...
      </div>
    `;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .list(
          currentUser.id,
          {
            limit: 1000,
            sortBy: {
              column: "created_at",
              order: "desc"
            }
          }
        );


    if (error)
      throw error;


    allFiles =
      (data || [])
        .filter(
          file =>
            file.name !==
            ".emptyFolderPlaceholder"
        );


    /*
      Render SEKARANG.

      Tidak menunggu gambar.
    */

    renderFiles(
      allFiles
    );


    /*
      Thumbnail dilakukan setelah
      browser selesai merender UI.
    */

    if (
      typeof requestIdleCallback ===
      "function"
    ) {

      requestIdleCallback(
        () => loadThumbnailsBatch()
      );

    } else {

      setTimeout(
        loadThumbnailsBatch,
        50
      );

    }

  } catch (error) {

    console.error(error);

    fileList.innerHTML = `
      <div class="empty">
        Gagal memuat file:<br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;
  }
}


/* =====================================================
   RENDER FILES

   TIDAK ADA AWAIT.
   TIDAK ADA REQUEST SUPABASE.
===================================================== */

function renderFiles(
  files
) {

  fileList.innerHTML = "";

  fileCount.textContent =
    `${files.length} file`;


  if (!files.length) {

    emptyState.classList.remove(
      "hidden"
    );

    return;
  }


  emptyState.classList.add(
    "hidden"
  );


  const fragment =
    document.createDocumentFragment();


  for (
    const file of files
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "file-card";


    const safeName =
      escapeHtml(
        file.name
      );


    const image =
      isImageFile(
        file.name
      );


    card.innerHTML = `

      <div class="thumbnail">

        ${
          image

            ? `
              <img
                data-thumbnail="${safeName}"
                alt=""
              >
            `

            : `
              <div class="file-icon">
                ${getFileIcon(file.name)}
              </div>
            `
        }

      </div>


      <div class="file-info">

        <div
          class="file-name"
          title="${safeName}"
        >
          ${safeName}
        </div>

        <div class="file-meta">
          ${formatSize(
            file.metadata?.size || 0
          )}
          •
          ${formatDate(
            file.created_at
          )}
        </div>

      </div>


      <div class="file-actions">

        <button
          type="button"
          class="action-btn rename-btn"
        >
          ✏️ Rename
        </button>

        <button
          type="button"
          class="action-btn download-btn"
        >
          ⬇️ Download
        </button>

        <button
          type="button"
          class="action-btn delete-btn"
        >
          🗑️ Hapus
        </button>

      </div>

    `;


    card
      .querySelector(
        ".rename-btn"
      )
      .addEventListener(
        "click",
        () =>
          renameFile(
            file.name
          )
      );


    card
      .querySelector(
        ".download-btn"
      )
      .addEventListener(
        "click",
        () =>
          downloadFile(
            file.name
          )
      );


    card
      .querySelector(
        ".delete-btn"
      )
      .addEventListener(
        "click",
        () =>
          deleteFile(
            file.name
          )
      );


    fragment.appendChild(
      card
    );
  }


  /*
    Hanya satu operasi DOM.
  */

  fileList.appendChild(
    fragment
  );
}


/* =====================================================
   THUMBNAIL BATCH

   INI YANG MEMBUAT VERSI INI LEBIH RINGAN.

   Semua URL gambar diminta sekaligus,
   bukan satu request per gambar.
===================================================== */

async function loadThumbnailsBatch() {

  if (!currentUser)
    return;


  const imageElements =
    Array.from(
      document.querySelectorAll(
        "[data-thumbnail]"
      )
    );


  if (!imageElements.length)
    return;


  const fileNames =
    imageElements.map(
      element =>
        element.dataset.thumbnail
    );


  /*
    Cek cache dahulu.
  */

  const uncached =
    fileNames.filter(
      name =>
        !thumbnailCache.has(
          `${currentUser.id}/${name}`
        )
    );


  /*
    Kalau semua sudah ada di cache,
    langsung tampilkan.
  */

  if (!uncached.length) {

    imageElements.forEach(
      element => {

        const key =
          `${currentUser.id}/${element.dataset.thumbnail}`;

        const url =
          thumbnailCache.get(
            key
          );

        if (url) {

          element.src =
            url;

        }

      }
    );

    return;
  }


  try {

    const paths =
      uncached.map(
        name =>
          `${currentUser.id}/${name}`
      );


    /*
      SATU REQUEST untuk banyak URL.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .createSignedUrls(
          paths,
          60 * 60
        );


    if (error) {

      console.warn(
        "Thumbnail tidak tersedia:",
        error
      );

      return;
    }


    /*
      Simpan hasil ke cache.
    */

    (data || []).forEach(
      item => {

        if (
          !item.signedUrl ||
          !item.path
        ) return;


        thumbnailCache.set(
          item.path,
          item.signedUrl
        );

      }
    );


    /*
      Tampilkan gambar.
    */

    imageElements.forEach(
      element => {

        const name =
          element.dataset.thumbnail;


        const key =
          `${currentUser.id}/${name}`;


        const url =
          thumbnailCache.get(
            key
          );


        if (url) {

          element.src =
            url;

        }

      }
    );

  } catch (error) {

    console.warn(
      "Thumbnail error:",
      error
    );

  }
}


/* =====================================================
   UPLOAD SINGLE
===================================================== */

async function uploadSingleFile(
  file
) {

  if (
    file.size >
    MAX_FILE_SIZE
  ) {

    throw new Error(
      "Maksimal 100 MB"
    );
  }


  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


  const uniqueName =
    `${Date.now()}_${Math.random()
      .toString(36)
      .slice(2, 8)}_${safeName}`;


  const path =
    `${currentUser.id}/${uniqueName}`;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .upload(
        path,
        file,
        {
          cacheControl: "3600",
          upsert: false,
          contentType:
            file.type || undefined
        }
      );


  if (error)
    throw error;


  return uniqueName;
}


/* =====================================================
   MULTI UPLOAD
===================================================== */

async function uploadFiles(
  files
) {

  if (
    !files.length ||
    isUploading
  ) return;


  if (
    files.length >
    MAX_FILES
  ) {

    showUploadMessage(
      `Maksimal ${MAX_FILES} file sekaligus. Kamu memilih ${files.length} file.`
    );

    return;
  }


  isUploading = true;


  let next =
    0;

  let completed =
    0;

  let success =
    0;

  let failed =
    0;


  const errors = [];


  showUploadMessage(
    `Mengupload ${files.length} file...`,
    "loading"
  );


  async function worker() {

    while (true) {

      const index =
        next++;


      if (
        index >=
        files.length
      ) return;


      const file =
        files[index];


      try {

        await uploadSingleFile(
          file
        );

        success++;

      } catch (error) {

        failed++;

        errors.push(
          `${file.name}: ${
            error.message
          }`
        );

      }


      completed++;


      showUploadMessage(
        `Upload ${completed}/${files.length} • ${success} berhasil • ${failed} gagal`,
        "loading"
      );
    }
  }


  const workers =
    Math.min(
      MAX_CONCURRENT_UPLOADS,
      files.length
    );


  await Promise.all(
    Array.from(
      {
        length:
          workers
      },
      worker
    )
  );


  isUploading =
    false;


  if (failed === 0) {

    showUploadMessage(
      `${success} file berhasil diupload. ✅`,
      "success"
    );

  } else {

    showUploadMessage(
      `${success} berhasil • ${failed} gagal.`,
      success
        ? "success"
        : "error"
    );

    console.warn(
      errors
    );
  }


  fileInput.value = "";


  /*
    Refresh hanya satu request list.
  */

  await loadFiles();
}


/* =====================================================
   FILE INPUT
===================================================== */

fileInput.addEventListener(
  "change",
  async () => {

    const files =
      Array.from(
        fileInput.files || []
      );


    if (!files.length)
      return;


    await uploadFiles(
      files
    );

  }
);


/* =====================================================
   DRAG DROP
===================================================== */

[
  "dragenter",
  "dragover"
].forEach(
  eventName => {

    uploadArea.addEventListener(
      eventName,
      event => {

        event.preventDefault();

        uploadArea.classList.add(
          "drag"
        );

      }
    );

  }
);


[
  "dragleave",
  "drop"
].forEach(
  eventName => {

    uploadArea.addEventListener(
      eventName,
      event => {

        event.preventDefault();

        uploadArea.classList.remove(
          "drag"
        );

      }
    );

  }
);


uploadArea.addEventListener(
  "drop",
  async event => {

    const files =
      Array.from(
        event
          .dataTransfer
          .files || []
      );


    if (!files.length)
      return;


    await uploadFiles(
      files
    );

  }
);


/* =====================================================
   DOWNLOAD
===================================================== */

async function downloadFile(
  fileName
) {

  try {

    const path =
      `${currentUser.id}/${fileName}`;


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .createSignedUrl(
          path,
          60 * 60
        );


    if (error)
      throw error;


    if (!data?.signedUrl)
      throw new Error(
        "URL tidak tersedia."
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      data.signedUrl;

    link.target =
      "_blank";

    link.rel =
      "noopener";


    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

  } catch (error) {

    console.error(error);

    alert(
      "Download gagal: " +
      error.message
    );
  }
}


/* =====================================================
   RENAME

   METODE:
   1. Coba MOVE
   2. Jika gagal → COPY
   3. Jika COPY berhasil → DELETE file lama
===================================================== */

async function renameFile(
  oldName
) {

  if (!currentUser)
    return;


  const input =
    prompt(
      "Masukkan nama file baru:",
      oldName
    );


  if (input === null)
    return;


  const newName =
    input.trim();


  if (!newName) {

    alert(
      "Nama file tidak boleh kosong."
    );

    return;
  }


  if (
    newName === oldName
  ) return;


  const safeName =
    newName.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


  if (!safeName) {

    alert(
      "Nama file tidak valid."
    );

    return;
  }


  /*
    Cek duplicate.
  */

  const duplicate =
    allFiles.some(
      file =>
        file.name ===
        safeName
    );


  if (duplicate) {

    alert(
      "Nama file tersebut sudah digunakan."
    );

    return;
  }


  const oldPath =
    `${currentUser.id}/${oldName}`;

  const newPath =
    `${currentUser.id}/${safeName}`;


  showUploadMessage(
    `Mengganti nama ${oldName}...`,
    "loading"
  );


  try {

    /*
      METODE 1:
      MOVE
    */

    const moveResult =
      await supabaseClient
        .storage
        .from(BUCKET)
        .move(
          oldPath,
          newPath
        );


    if (!moveResult.error) {

      thumbnailCache.delete(
        oldPath
      );


      showUploadMessage(
        `Berhasil rename menjadi ${safeName}.`,
        "success"
      );


      await loadFiles();

      return;
    }


    /*
      Kalau MOVE ditolak policy,
      coba COPY.
    */

    console.warn(
      "MOVE gagal, mencoba COPY:",
      moveResult.error
    );


    const copyResult =
      await supabaseClient
        .storage
        .from(BUCKET)
        .copy(
          oldPath,
          newPath
        );


    if (copyResult.error) {

      throw copyResult.error;
    }


    /*
      COPY berhasil.
      Sekarang hapus file lama.
    */

    const removeResult =
      await supabaseClient
        .storage
        .from(BUCKET)
        .remove([
          oldPath
        ]);


    if (removeResult.error) {

      throw removeResult.error;
    }


    thumbnailCache.delete(
      oldPath
    );


    showUploadMessage(
      `Berhasil rename menjadi ${safeName}.`,
      "success"
    );


    await loadFiles();

  } catch (error) {

    console.error(
      "Rename error:",
      error
    );


    showUploadMessage(
      `Rename gagal: ${
        error.message ||
        "Storage Policy menolak operasi."
      }`,
      "error"
    );

  }
}


/* =====================================================
   DELETE

   UI langsung diperbarui,
   tidak perlu menunggu refresh.
===================================================== */

async function deleteFile(
  fileName
) {

  if (!currentUser)
    return;


  if (
    !confirm(
      `Hapus file "${fileName}"?`
    )
  ) return;


  const path =
    `${currentUser.id}/${fileName}`;


  try {

    const {
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .remove([
          path
        ]);


    if (error)
      throw error;


    /*
      Hapus dari memory.
    */

    allFiles =
      allFiles.filter(
        file =>
          file.name !==
          fileName
      );


    /*
      Hapus cache.
    */

    thumbnailCache.delete(
      path
    );


    /*
      Render ulang lokal.
      Tidak request Supabase.
    */

    renderFiles(
      getFilteredFiles()
    );


    showUploadMessage(
      "File berhasil dihapus. ✅",
      "success"
    );

  } catch (error) {

    console.error(error);

    alert(
      "Gagal menghapus file: " +
      error.message
    );
  }
}


/* =====================================================
   SEARCH

   100% LOCAL.
   Tidak request Supabase.
===================================================== */

function getFilteredFiles() {

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  if (!keyword)
    return allFiles;


  return allFiles.filter(
    file =>
      file.name
        .toLowerCase()
        .includes(keyword)
  );
}


searchInput.addEventListener(
  "input",
  () => {

    renderFiles(
      getFilteredFiles()
    );


    /*
      Thumbnail baru dimuat setelah
      hasil search selesai dirender.
    */

    setTimeout(
      loadThumbnailsBatch,
      0
    );

  }
);


/* =====================================================
   REFRESH
===================================================== */

document
  .getElementById(
    "refreshButton"
  )
  .addEventListener(
    "click",
    async () => {

      const button =
        document.getElementById(
          "refreshButton"
        );


      button.disabled =
        true;


      try {

        await loadFiles();

      } finally {

        button.disabled =
          false;

      }
    }
  );


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    async (
      event,
      session
    ) => {

      if (
        session?.user
      ) {

        currentUser =
          session.user;

        await showStorage();

      } else {

        currentUser = null;

        allFiles = [];

        thumbnailCache.clear();

        storagePage.classList.add(
          "hidden"
        );

        authPage.classList.remove(
          "hidden"
        );

      }

    }
  );


/* =====================================================
   INITIAL LOAD
===================================================== */

(async function init() {

  try {

    const {
      data
    } =
      await supabaseClient
        .auth
        .getUser();


    if (data?.user) {

      currentUser =
        data.user;

      await showStorage();

    }

  } catch (error) {

    console.error(
      "Init error:",
      error
    );

  }

})();

</script>
