<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Cloud Storage</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- ================= LOGIN / REGISTER ================= -->

  <div id="authPage" class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-7">

      <div class="text-center mb-6">
        <div class="text-5xl mb-3">☁️</div>

        <h1 class="text-2xl font-bold text-gray-800">
          My Cloud Storage
        </h1>

        <p class="text-gray-500 mt-1">
          Simpan file kamu dengan aman
        </p>
      </div>


      <!-- LOGIN -->

      <div id="loginForm">

        <h2 class="text-xl font-semibold mb-4">
          Login
        </h2>

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button
          id="loginButton"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg"
        >
          Login
        </button>

        <p class="text-center text-sm text-gray-500 mt-5">
          Belum punya akun?
          <button
            id="showRegister"
            class="text-blue-600 font-semibold"
          >
            Daftar
          </button>
        </p>

      </div>


      <!-- REGISTER -->

      <div id="registerForm" class="hidden">

        <h2 class="text-xl font-semibold mb-4">
          Buat Akun
        </h2>

        <input
          id="registerEmail"
          type="email"
          placeholder="Email"
          class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <input
          id="registerPassword"
          type="password"
          placeholder="Password minimal 6 karakter"
          class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button
          id="registerButton"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg"
        >
          Daftar
        </button>

        <p class="text-center text-sm text-gray-500 mt-5">
          Sudah punya akun?
          <button
            id="showLogin"
            class="text-blue-600 font-semibold"
          >
            Login
          </button>
        </p>

      </div>


      <!-- AUTH MESSAGE -->

      <div
        id="authMessage"
        class="hidden mt-4 p-3 rounded-lg text-sm"
      ></div>

    </div>
  </div>


  <!-- ================= STORAGE PAGE ================= -->

  <div id="storagePage" class="hidden min-h-screen">

    <!-- HEADER -->

    <header class="bg-white shadow-sm">

      <div class="max-w-5xl mx-auto px-4 py-4">

        <div class="flex items-center justify-between gap-3">

          <div>
            <h1 class="text-xl md:text-2xl font-bold text-gray-800">
              ☁️ My Cloud Storage
            </h1>

            <p
              id="userEmail"
              class="text-sm text-gray-500 break-all"
            ></p>
          </div>

          <button
            id="logoutButton"
            class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold"
          >
            Logout
          </button>

        </div>

      </div>

    </header>


    <!-- MAIN -->

    <main class="max-w-5xl mx-auto px-4 py-6">


      <!-- UPLOAD AREA -->

      <div class="bg-white rounded-2xl shadow-sm p-5 mb-6">

        <h2 class="text-lg font-bold text-gray-800 mb-2">
          Upload File
        </h2>

        <p class="text-sm text-gray-500 mb-4">
          Maksimal ukuran satu file: <b>100 MB</b>
        </p>


        <label
          for="fileInput"
          class="block border-2 border-dashed border-gray-300 hover:border-blue-500 rounded-xl p-8 text-center cursor-pointer transition"
        >

          <div class="text-4xl mb-2">
            📤
          </div>

          <div class="font-semibold text-gray-700">
            Klik untuk memilih file
          </div>

          <div class="text-sm text-gray-400 mt-1">
            atau drag & drop file di sini
          </div>

          <input
            id="fileInput"
            type="file"
            class="hidden"
          />

        </label>


        <!-- UPLOAD STATUS -->

        <div
          id="uploadStatus"
          class="hidden mt-4 p-3 rounded-lg text-sm"
        ></div>

      </div>


      <!-- SEARCH -->

      <div class="bg-white rounded-2xl shadow-sm p-4 mb-5">

        <div class="flex gap-2">

          <input
            id="searchInput"
            type="text"
            placeholder="🔎 Cari file..."
            class="flex-1 border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />

          <button
            id="refreshButton"
            class="bg-gray-700 hover:bg-gray-800 text-white px-4 rounded-lg"
          >
            ↻
          </button>

        </div>

      </div>


      <!-- FILE INFO -->

      <div class="flex justify-between items-center mb-3">

        <h2 class="text-lg font-bold text-gray-800">
          File Saya
        </h2>

        <span
          id="fileCount"
          class="text-sm text-gray-500"
        >
          0 file
        </span>

      </div>


      <!-- FILE LIST -->

      <div
        id="fileList"
        class="space-y-3"
      ></div>


      <!-- EMPTY -->

      <div
        id="emptyState"
        class="hidden bg-white rounded-2xl p-10 text-center"
      >

        <div class="text-5xl mb-3">
          📂
        </div>

        <h3 class="font-semibold text-gray-700">
          Belum ada file
        </h3>

        <p class="text-sm text-gray-400 mt-1">
          Upload file pertama kamu.
        </p>

      </div>

    </main>

  </div>


<script>

  /* =====================================================
     SUPABASE CONFIG
  ===================================================== */

  const SUPABASE_URL =
    "https://jbrrlophgrdqniorjkjn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_VxFQ1sUpf4-wjEpzhg4IMg_c_scLRSQ";

  const BUCKET =
    "file-storage";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     SETTINGS
  ===================================================== */

  const MAX_FILE_SIZE =
    100 * 1024 * 1024;


  let currentUser = null;
  let allFiles = [];


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const authPage =
    document.getElementById("authPage");

  const storagePage =
    document.getElementById("storagePage");

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const authMessage =
    document.getElementById("authMessage");

  const fileInput =
    document.getElementById("fileInput");

  const fileList =
    document.getElementById("fileList");

  const emptyState =
    document.getElementById("emptyState");

  const fileCount =
    document.getElementById("fileCount");

  const searchInput =
    document.getElementById("searchInput");

  const uploadStatus =
    document.getElementById("uploadStatus");


  /* =====================================================
     AUTH MESSAGE
  ===================================================== */

  function showAuthMessage(message, type = "error") {

    authMessage.textContent = message;

    authMessage.classList.remove(
      "hidden",
      "bg-red-100",
      "text-red-700",
      "bg-green-100",
      "text-green-700"
    );

    if (type === "success") {

      authMessage.classList.add(
        "bg-green-100",
        "text-green-700"
      );

    } else {

      authMessage.classList.add(
        "bg-red-100",
        "text-red-700"
      );

    }

  }


  /* =====================================================
     UPLOAD MESSAGE
  ===================================================== */

  function showUploadMessage(message, type = "error") {

    uploadStatus.textContent = message;

    uploadStatus.classList.remove(
      "hidden",
      "bg-red-100",
      "text-red-700",
      "bg-green-100",
      "text-green-700",
      "bg-blue-100",
      "text-blue-700"
    );


    if (type === "success") {

      uploadStatus.classList.add(
        "bg-green-100",
        "text-green-700"
      );

    } else if (type === "loading") {

      uploadStatus.classList.add(
        "bg-blue-100",
        "text-blue-700"
      );

    } else {

      uploadStatus.classList.add(
        "bg-red-100",
        "text-red-700"
      );

    }

  }


  /* =====================================================
     SWITCH LOGIN / REGISTER
  ===================================================== */

  document
    .getElementById("showRegister")
    .addEventListener("click", () => {

      loginForm.classList.add("hidden");
      registerForm.classList.remove("hidden");

      authMessage.classList.add("hidden");

    });


  document
    .getElementById("showLogin")
    .addEventListener("click", () => {

      registerForm.classList.add("hidden");
      loginForm.classList.remove("hidden");

      authMessage.classList.add("hidden");

    });


  /* =====================================================
     REGISTER
  ===================================================== */

  document
    .getElementById("registerButton")
    .addEventListener("click", async () => {

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;


      if (!email || !password) {

        showAuthMessage(
          "Email dan password harus diisi."
        );

        return;

      }


      if (password.length < 6) {

        showAuthMessage(
          "Password minimal 6 karakter."
        );

        return;

      }


      const button =
        document.getElementById("registerButton");

      button.disabled = true;
      button.textContent = "Mendaftarkan...";


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        if (data.session) {

          showAuthMessage(
            "Akun berhasil dibuat!",
            "success"
          );

          await loadUser();

        } else {

          showAuthMessage(
            "Akun berhasil dibuat. Silakan cek email untuk verifikasi.",
            "success"
          );

        }

      } catch (error) {

        console.error(error);

        showAuthMessage(
          error.message || "Gagal membuat akun."
        );

      } finally {

        button.disabled = false;
        button.textContent = "Daftar";

      }

    });


  /* =====================================================
     LOGIN
  ===================================================== */

  document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      if (!email || !password) {

        showAuthMessage(
          "Email dan password harus diisi."
        );

        return;

      }


      const button =
        document.getElementById("loginButton");

      button.disabled = true;
      button.textContent = "Login...";


      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        currentUser = data.user;

        await showStoragePage();

      } catch (error) {

        console.error(error);

        showAuthMessage(
          error.message || "Email atau password salah."
        );

      } finally {

        button.disabled = false;
        button.textContent = "Login";

      }

    });


  /* =====================================================
     LOGOUT
  ===================================================== */

  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      currentUser = null;

      storagePage.classList.add("hidden");
      authPage.classList.remove("hidden");

      fileList.innerHTML = "";

    });


  /* =====================================================
     LOAD CURRENT USER
  ===================================================== */

  async function loadUser() {

    const { data, error } =
      await supabaseClient.auth.getUser();


    if (error || !data.user) {

      authPage.classList.remove("hidden");
      storagePage.classList.add("hidden");

      return;

    }


    currentUser = data.user;

    await showStoragePage();

  }


  /* =====================================================
     SHOW STORAGE
  ===================================================== */

  async function showStoragePage() {

    authPage.classList.add("hidden");
    storagePage.classList.remove("hidden");

    document.getElementById("userEmail").textContent =
      currentUser.email;

    await loadFiles();

  }


  /* =====================================================
     FILE ICON
  ===================================================== */

  function getFileIcon(fileName) {

    const ext =
      fileName.split(".").pop().toLowerCase();


    const images =
      ["jpg", "jpeg", "png", "gif", "webp", "svg"];

    const videos =
      ["mp4", "mov", "avi", "mkv", "webm"];

    const audio =
      ["mp3", "wav", "ogg", "m4a"];

    const documents =
      ["pdf", "doc", "docx", "txt"];

    const archives =
      ["zip", "rar", "7z"];


    if (images.includes(ext)) return "🖼️";
    if (videos.includes(ext)) return "🎬";
    if (audio.includes(ext)) return "🎵";
    if (documents.includes(ext)) return "📄";
    if (archives.includes(ext)) return "📦";

    return "📁";

  }


  /* =====================================================
     FILE SIZE
  ===================================================== */

  function formatSize(bytes) {

    if (bytes === 0) return "0 Bytes";

    const units =
      ["Bytes", "KB", "MB", "GB"];

    const i =
      Math.floor(
        Math.log(bytes) / Math.log(1024)
      );

    return (
      parseFloat(
        (bytes / Math.pow(1024, i)).toFixed(2)
      ) +
      " " +
      units[i]
    );

  }


  /* =====================================================
     FILE DATE
  ===================================================== */

  function formatDate(date) {

    return new Date(date).toLocaleString(
      "id-ID",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  /* =====================================================
     LOAD FILES
  ===================================================== */

  async function loadFiles() {

    if (!currentUser) return;


    fileList.innerHTML = `
      <div class="bg-white rounded-xl p-6 text-center text-gray-500">
        Memuat file...
      </div>
    `;


    try {

      const folder =
        currentUser.id;


      const { data, error } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .list(folder, {
            limit: 1000,
            sortBy: {
              column: "created_at",
              order: "desc"
            }
          });


      if (error) {
        throw error;
      }


      allFiles = (data || []).filter(
        file => file.name !== ".emptyFolderPlaceholder"
      );


      renderFiles(allFiles);

    } catch (error) {

      console.error(error);

      fileList.innerHTML = `
        <div class="bg-red-100 text-red-700 rounded-xl p-4">
          Gagal memuat file: ${escapeHtml(error.message)}
        </div>
      `;

    }

  }


  /* =====================================================
     RENDER FILES
  ===================================================== */

  function renderFiles(files) {

    fileList.innerHTML = "";

    fileCount.textContent =
      `${files.length} file${files.length !== 1 ? "s" : ""}`;


    if (files.length === 0) {

      emptyState.classList.remove("hidden");

      return;

    }


    emptyState.classList.add("hidden");


    files.forEach(file => {

      const card =
        document.createElement("div");

      card.className =
        "bg-white rounded-xl shadow-sm p-4 flex items-center gap-3";


      const name =
        escapeHtml(file.name);


      const size =
        formatSize(file.metadata?.size || 0);


      const created =
        formatDate(
          file.created_at || new Date()
        );


      card.innerHTML = `

        <div class="text-3xl flex-shrink-0">
          ${getFileIcon(file.name)}
        </div>

        <div class="flex-1 min-w-0">

          <div
            class="font-semibold text-gray-800 truncate"
            title="${name}"
          >
            ${name}
          </div>

          <div class="text-xs text-gray-400 mt-1">
            ${size} • ${created}
          </div>

        </div>

        <div class="flex gap-2 flex-shrink-0">

          <button
            class="downloadButton bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm"
          >
            Download
          </button>

          <button
            class="deleteButton bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm"
          >
            Hapus
          </button>

        </div>
      `;


      card
        .querySelector(".downloadButton")
        .addEventListener(
          "click",
          () => downloadFile(file.name)
        );


      card
        .querySelector(".deleteButton")
        .addEventListener(
          "click",
          () => deleteFile(file.name)
        );


      fileList.appendChild(card);

    });

  }


  /* =====================================================
     UPLOAD
  ===================================================== */

  fileInput.addEventListener(
    "change",
    async function () {

      const file =
        this.files[0];


      if (!file) return;


      if (!currentUser) {

        showUploadMessage(
          "Silakan login terlebih dahulu."
        );

        return;

      }


      if (file.size > MAX_FILE_SIZE) {

        showUploadMessage(
          `File terlalu besar. Maksimal 100 MB. Ukuran file kamu: ${formatSize(file.size)}`
        );

        this.value = "";

        return;

      }


      showUploadMessage(
        `Sedang mengupload ${file.name}...`,
        "loading"
      );


      try {

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const fileName =
          `${Date.now()}_${safeName}`;


        const filePath =
          `${currentUser.id}/${fileName}`;


        const { error } =
          await supabaseClient
            .storage
            .from(BUCKET)
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (error) {
          throw error;
        }


        showUploadMessage(
          "File berhasil diupload! ✅",
          "success"
        );


        this.value = "";


        await loadFiles();


      } catch (error) {

        console.error(error);

        showUploadMessage(
          "Upload gagal: " +
          (error.message || "Terjadi kesalahan.")
        );

      }

    }
  );


  /* =====================================================
     DOWNLOAD
  ===================================================== */

  async function downloadFile(fileName) {

    try {

      const filePath =
        `${currentUser.id}/${fileName}`;


      const { data, error } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .createSignedUrl(
            filePath,
            60 * 60
          );


      if (error) {
        throw error;
      }


      window.open(
        data.signedUrl,
        "_blank"
      );


    } catch (error) {

      console.error(error);

      alert(
        "Download gagal: " +
        error.message
      );

    }

  }


  /* =====================================================
     DELETE
  ===================================================== */

  async function deleteFile(fileName) {

    if (
      !confirm(
        `Hapus file "${fileName}"?`
      )
    ) {
      return;
    }


    try {

      const filePath =
        `${currentUser.id}/${fileName}`;


      const { error } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .remove([
            filePath
          ]);


      if (error) {
        throw error;
      }


      await loadFiles();


    } catch (error) {

      console.error(error);

      alert(
        "Gagal menghapus file: " +
        error.message
      );

    }

  }


  /* =====================================================
     SEARCH
  ===================================================== */

  searchInput.addEventListener(
    "input",
    function () {

      const keyword =
        this.value
          .toLowerCase()
          .trim();


      if (!keyword) {

        renderFiles(allFiles);

        return;

      }


      const filtered =
        allFiles.filter(file =>
          file.name
            .toLowerCase()
            .includes(keyword)
        );


      renderFiles(filtered);

    }
  );


  /* =====================================================
     REFRESH
  ===================================================== */

  document
    .getElementById("refreshButton")
    .addEventListener(
      "click",
      loadFiles
    );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (
        session &&
        session.user
      ) {

        currentUser =
          session.user;

        await showStoragePage();

      } else {

        currentUser = null;

        storagePage.classList.add("hidden");
        authPage.classList.remove("hidden");

      }

    }
  );


  /* =====================================================
     START
  ===================================================== */

  loadUser();

</script>

</body>
</html>
