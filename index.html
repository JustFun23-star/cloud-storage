<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Cloud Storage</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, #e0e7ff 0, transparent 35%),
        radial-gradient(circle at top right, #dbeafe 0, transparent 30%),
        #f8fafc;
      color: #1e293b;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,
        opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 24px;
      padding: 30px;
      box-shadow:
        0 20px 60px rgba(15,23,42,0.10),
        0 4px 15px rgba(15,23,42,0.04);
      backdrop-filter: blur(12px);
    }

    .auth-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 36px;
      box-shadow: 0 12px 30px rgba(37,99,235,0.25);
    }

    .auth-title {
      font-size: 25px;
      font-weight: 800;
      text-align: center;
      color: #0f172a;
    }

    .auth-subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-top: 5px;
      margin-bottom: 25px;
    }

    .auth-input {
      width: 100%;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      background: #fff;
      margin-bottom: 12px;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .auth-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.10);
    }

    .auth-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 8px 20px rgba(37,99,235,0.20);
    }

    .auth-button:hover {
      box-shadow: 0 10px 25px rgba(37,99,235,0.30);
    }

    .register-button {
      background: linear-gradient(135deg, #059669, #10b981);
    }

    .switch-auth {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }

    .switch-auth button {
      border: 0;
      background: transparent;
      color: #2563eb;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .auth-message {
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    /* =========================
       HEADER
    ========================= */

    .main-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.90);
      border-bottom: 1px solid rgba(226,232,240,0.8);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 23px;
      box-shadow: 0 7px 18px rgba(37,99,235,0.22);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .brand-email {
      color: #64748b;
      font-size: 12px;
      margin-top: 1px;
      max-width: 350px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* =========================
       MAIN
    ========================= */

    .main-container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .panel {
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 20px;
      box-shadow:
        0 8px 30px rgba(15,23,42,0.05);
    }

    /* =========================
       UPLOAD
    ========================= */

    .upload-card {
      padding: 22px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
    }

    .section-description {
      color: #64748b;
      font-size: 13px;
      margin-top: 4px;
      margin-bottom: 16px;
    }

    .upload-label {
      display: block;
      border: 2px dashed #cbd5e1;
      border-radius: 17px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      background: linear-gradient(
        180deg,
        #f8fafc,
        #ffffff
      );
      transition:
        border 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .upload-label:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .upload-label.drag-active {
      border-color: #2563eb;
      background: #dbeafe;
      transform: scale(1.01);
    }

    .upload-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dbeafe;
      font-size: 28px;
    }

    .upload-main-text {
      font-weight: 800;
      color: #334155;
      font-size: 15px;
    }

    .upload-sub-text {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 5px;
    }

    .upload-limit {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-card {
      padding: 14px;
      margin-bottom: 20px;
    }

    .search-wrapper {
      display: flex;
      gap: 9px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      background: white;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.09);
    }

    .refresh-btn {
      width: 46px;
      flex-shrink: 0;
      border: 0;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    .refresh-btn:hover {
      background: #1e293b;
    }

    /* =========================
       FILE HEADER
    ========================= */

    .files-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    .files-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .files-count {
      padding: 5px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       FILE CARD
    ========================= */

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 12px;
      background: rgba(255,255,255,0.97);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(15,23,42,0.035);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border 0.18s ease;
    }

    .file-card:hover {
      transform: translateY(-1px);
      border-color: #cbd5e1;
      box-shadow: 0 9px 25px rgba(15,23,42,0.07);
    }

    /* Thumbnail FIXED supaya tidak ketutup tombol */

    .file-thumbnail {
      position: relative;
      width: 100px;
      height: 78px;
      flex: 0 0 100px;
      overflow: hidden;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8fafc
        );
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-thumbnail-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .file-thumbnail-image.loaded {
      opacity: 1;
    }

    .file-thumbnail-image.failed {
      display: none;
    }

    .file-icon {
      font-size: 32px;
      line-height: 1;
      user-select: none;
    }

    .thumbnail-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 20px;
      pointer-events: none;
    }

    .thumbnail-loading.hidden {
      display: none;
    }

    .file-info {
      flex: 1 1 auto;
      min-width: 0;
    }

    .file-name {
      color: #0f172a;
      font-size: 14px;
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-meta {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 5px;
      line-height: 1.4;
    }

    .file-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .action-btn {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .rename-button {
      background: #f59e0b;
    }

    .rename-button:hover {
      background: #d97706;
    }

    .download-button {
      background: #2563eb;
    }

    .download-button:hover {
      background: #1d4ed8;
    }

    .delete-button {
      background: #ef4444;
    }

    .delete-button:hover {
      background: #dc2626;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .empty-state {
      padding: 45px 20px;
      text-align: center;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 18px;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .empty-title {
      font-weight: 800;
      color: #334155;
    }

    .empty-description {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 4px;
    }

    .loading-box {
      padding: 22px;
      text-align: center;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      color: #64748b;
      font-size: 13px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      margin: 0 auto 8px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {

      .file-card {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .file-info {
        padding-top: 2px;
      }

      .file-actions {
        width: 100%;
        padding-left: 114px;
        justify-content: flex-start;
      }

    }

    @media (max-width: 600px) {

      .main-container {
        padding: 18px 12px 40px;
      }

      .header-inner {
        padding: 12px;
      }

      .brand-title {
        font-size: 16px;
      }

      .brand-email {
        max-width: 180px;
      }

      .upload-card {
        padding: 16px;
      }

      .upload-label {
        padding: 25px 15px;
      }

      .file-thumbnail {
        width: 88px;
        height: 70px;
        flex-basis: 88px;
      }

      .file-actions {
        padding-left: 102px;
      }

    }

    @media (max-width: 460px) {

      .brand-icon {
        width: 39px;
        height: 39px;
        font-size: 20px;
      }

      .logout-btn {
        padding: 8px 10px;
      }

      .file-card {
        gap: 10px;
      }

      .file-thumbnail {
        width: 75px;
        height: 62px;
        flex-basis: 75px;
      }

      .file-actions {
        padding-left: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .action-btn {
        width: 100%;
        padding: 8px 5px;
        font-size: 11px;
      }

    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN / REGISTER
  ===================================================== -->

  <div id="authPage" class="auth-page">

    <div class="auth-card">

      <div class="auth-logo">
        ☁️
      </div>

      <div class="auth-title">
        My Cloud Storage
      </div>

      <div class="auth-subtitle">
        Simpan file kamu dengan aman
      </div>


      <!-- LOGIN -->

      <div id="loginForm">

        <h2 class="text-lg font-bold text-slate-800 mb-4">
          Login
        </h2>

        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="Email"
          class="auth-input"
        />

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          class="auth-input"
        />

        <button
          id="loginButton"
          class="auth-button"
          type="button"
        >
          Login
        </button>

        <div class="switch-auth">
          Belum punya akun?
          <button id="showRegister" type="button">
            Daftar
          </button>
        </div>

      </div>


      <!-- REGISTER -->

      <div id="registerForm" class="hidden">

        <h2 class="text-lg font-bold text-slate-800 mb-4">
          Buat Akun
        </h2>

        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          placeholder="Email"
          class="auth-input"
        />

        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Password minimal 6 karakter"
          class="auth-input"
        />

        <button
          id="registerButton"
          class="auth-button register-button"
          type="button"
        >
          Daftar
        </button>

        <div class="switch-auth">
          Sudah punya akun?
          <button id="showLogin" type="button">
            Login
          </button>
        </div>

      </div>


      <div
        id="authMessage"
        class="auth-message hidden"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       STORAGE
  ===================================================== -->

  <div id="storagePage" class="hidden min-h-screen">

    <header class="main-header">

      <div class="header-inner">

        <div class="brand">

          <div class="brand-icon">
            ☁️
          </div>

          <div>
            <div class="brand-title">
              My Cloud Storage
            </div>

            <div
              id="userEmail"
              class="brand-email"
            ></div>
          </div>

        </div>

        <button
          id="logoutButton"
          class="logout-btn"
          type="button"
        >
          Logout
        </button>

      </div>

    </header>


    <main class="main-container">

      <!-- UPLOAD -->

      <section class="panel upload-card">

        <div class="section-title">
          Upload File
        </div>

        <div class="section-description">
          Upload maksimal 10 file sekaligus.
          Ukuran maksimal 100 MB per file.
        </div>

        <label
          id="uploadLabel"
          for="fileInput"
          class="upload-label"
        >

          <div class="upload-icon">
            📤
          </div>

          <div class="upload-main-text">
            Klik untuk memilih banyak file
          </div>

          <div class="upload-sub-text">
            atau drag & drop maksimal 10 file di sini
          </div>

          <div class="upload-limit">
            10 FILE • 100 MB / FILE
          </div>

          <input
            id="fileInput"
            type="file"
            class="hidden"
            multiple
          />

        </label>


        <div
          id="uploadStatus"
          class="hidden mt-4 p-3 rounded-xl text-sm"
        ></div>

      </section>


      <!-- SEARCH -->

      <section class="panel search-card">

        <div class="search-wrapper">

          <input
            id="searchInput"
            type="text"
            placeholder="🔎 Cari file..."
            class="search-input"
            autocomplete="off"
          />

          <button
            id="refreshButton"
            class="refresh-btn"
            type="button"
            title="Refresh"
          >
            ↻
          </button>

        </div>

      </section>


      <!-- FILE HEADER -->

      <div class="files-header">

        <div class="files-title">
          File Saya
        </div>

        <div
          id="fileCount"
          class="files-count"
        >
          0 file
        </div>

      </div>


      <!-- FILE LIST -->

      <div
        id="fileList"
        class="file-list"
      ></div>


      <!-- EMPTY -->

      <div
        id="emptyState"
        class="empty-state hidden"
      >

        <div class="empty-icon">
          📂
        </div>

        <div class="empty-title">
          Belum ada file
        </div>

        <div class="empty-description">
          Upload file pertama kamu.
        </div>

      </div>

    </main>

  </div>


  <script>

    /* =====================================================
       SUPABASE CONFIG
    ===================================================== */

    const SUPABASE_URL =
      "https://jbrrlophgrdqniorjkjn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_VxFQ1sUpf4-wjEpzhg4IMg_c_scLRSQ";

    const BUCKET =
      "file-storage";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       SETTINGS
    ===================================================== */

    const MAX_FILE_SIZE =
      100 * 1024 * 1024;

    const MAX_FILES_PER_UPLOAD =
      10;

    /*
      Maksimal 10 upload berjalan bersamaan.
    */
    const MAX_CONCURRENT_UPLOADS =
      10;


    let currentUser = null;

    let allFiles = [];

    let isUploading = false;


    /*
      CACHE THUMBNAIL

      Tujuannya supaya:
      - search tidak membuat URL baru
      - render ulang tidak meminta URL lagi
      - thumbnail yang sudah pernah dimuat bisa dipakai kembali
    */

    const thumbnailCache =
      new Map();


    /*
      IntersectionObserver

      Thumbnail baru dimuat ketika card
      mendekati area layar.
    */

    let thumbnailObserver = null;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const authPage =
      document.getElementById("authPage");

    const storagePage =
      document.getElementById("storagePage");

    const loginForm =
      document.getElementById("loginForm");

    const registerForm =
      document.getElementById("registerForm");

    const authMessage =
      document.getElementById("authMessage");

    const fileInput =
      document.getElementById("fileInput");

    const fileList =
      document.getElementById("fileList");

    const emptyState =
      document.getElementById("emptyState");

    const fileCount =
      document.getElementById("fileCount");

    const searchInput =
      document.getElementById("searchInput");

    const uploadStatus =
      document.getElementById("uploadStatus");

    const uploadLabel =
      document.getElementById("uploadLabel");


    /* =====================================================
       AUTH MESSAGE
    ===================================================== */

    function showAuthMessage(
      message,
      type = "error"
    ) {

      authMessage.textContent =
        message;

      authMessage.classList.remove(
        "hidden",
        "bg-red-100",
        "text-red-700",
        "bg-green-100",
        "text-green-700"
      );


      if (type === "success") {

        authMessage.classList.add(
          "bg-green-100",
          "text-green-700"
        );

      } else {

        authMessage.classList.add(
          "bg-red-100",
          "text-red-700"
        );

      }

    }


    /* =====================================================
       UPLOAD MESSAGE
    ===================================================== */

    function showUploadMessage(
      message,
      type = "error"
    ) {

      uploadStatus.textContent =
        message;

      uploadStatus.classList.remove(
        "hidden",
        "bg-red-100",
        "text-red-700",
        "bg-green-100",
        "text-green-700",
        "bg-blue-100",
        "text-blue-700"
      );


      if (type === "success") {

        uploadStatus.classList.add(
          "bg-green-100",
          "text-green-700"
        );

      } else if (type === "loading") {

        uploadStatus.classList.add(
          "bg-blue-100",
          "text-blue-700"
        );

      } else {

        uploadStatus.classList.add(
          "bg-red-100",
          "text-red-700"

    /* =====================================================
       FILE ICON
    ===================================================== */

    function getFileIcon(fileName) {

      const ext =
        fileName
          .split(".")
          .pop()
          .toLowerCase();


      const images = [
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "svg"
      ];

      const videos = [
        "mp4",
        "mov",
        "avi",
        "mkv",
        "webm"
      ];

      const audio = [
        "mp3",
        "wav",
        "ogg",
        "m4a"
      ];

      const documents = [
        "pdf",
        "doc",
        "docx",
        "txt",
        "xls",
        "xlsx",
        "ppt",
        "pptx"
      ];

      const archives = [
        "zip",
        "rar",
        "7z"
      ];


      if (images.includes(ext))
        return "🖼️";

      if (videos.includes(ext))
        return "🎬";

      if (audio.includes(ext))
        return "🎵";

      if (documents.includes(ext))
        return "📄";

      if (archives.includes(ext))
        return "📦";


      return "📁";

    }


    /* =====================================================
       IMAGE CHECK
    ===================================================== */

    function isImageFile(fileName) {

      return /\.(jpg|jpeg|png|gif|webp|svg)$/i
        .test(fileName);

    }


    /* =====================================================
       FILE SIZE
    ===================================================== */

    function formatSize(bytes) {

      if (!bytes)
        return "0 Bytes";


      const units = [
        "Bytes",
        "KB",
        "MB",
        "GB"
      ];


      const i =
        Math.floor(
          Math.log(bytes) /
          Math.log(1024)
        );


      return (
        parseFloat(
          (
            bytes /
            Math.pow(1024, i)
          ).toFixed(2)
        ) +
        " " +
        units[i]
      );

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(date) {

      try {

        return new Date(date)
          .toLocaleString(
            "id-ID",
            {
              dateStyle: "medium",
              timeStyle: "short"
            }
          );

      } catch {

        return "-";

      }

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(text) {

      const div =
        document.createElement("div");


      div.textContent =
        String(text);


      return div.innerHTML;

    }


    /* =====================================================
       GET THUMBNAIL URL
       
       INI BAGIAN PENTING UNTUK SPEED.

       Kita meminta Supabase membuat gambar
       thumbnail 300x220, bukan mengambil
       gambar original.
    ===================================================== */

    async function getThumbnailUrl(
      fileName
    ) {

      if (!currentUser)
        return null;


      const cacheKey =
        `${currentUser.id}/${fileName}`;


      /*
        Kalau sudah pernah dibuat,
        langsung gunakan cache.
      */

      if (
        thumbnailCache.has(cacheKey)
      ) {

        return thumbnailCache.get(
          cacheKey
        );

      }


      try {

        const filePath =
          `${currentUser.id}/${fileName}`;


        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from(BUCKET)
            .createSignedUrl(
              filePath,
              60 * 60,
              {
                transform: {
                  width: 300,
                  height: 220,
                  resize: "cover",
                  quality: 65
                }
              }
            );


        if (
          error ||
          !data?.signedUrl
        ) {

          return null;

        }


        thumbnailCache.set(
          cacheKey,
          data.signedUrl
        );


        return data.signedUrl;

      } catch (error) {

        console.error(
          "Thumbnail error:",
          error
        );

        return null;

      }

    }


    /* =====================================================
       LAZY THUMBNAIL
    ===================================================== */

    function setupThumbnailObserver() {

      if (
        thumbnailObserver
      ) {

        thumbnailObserver.disconnect();

      }


      /*
        Browser modern:
        IntersectionObserver tersedia.
      */

      if (
        "IntersectionObserver"
        in window
      ) {

        thumbnailObserver =
          new IntersectionObserver(
            entries => {

              entries.forEach(
                entry => {

                  if (
                    !entry.isIntersecting
                  ) {

                    return;

                  }


                  const element =
                    entry.target;


                  thumbnailObserver
                    .unobserve(
                      element
                    );


                  loadThumbnail(
                    element
                  );

                }
              );

            },
            {
              rootMargin:
                "300px 0px"
            }
          );


        document
          .querySelectorAll(
            "[data-thumbnail-file]"
          )
          .forEach(
            element => {

              thumbnailObserver.observe(
                element
              );

            }
          );

      } else {

        /*
          Fallback browser lama:
          load thumbnail langsung.
        */

        document
          .querySelectorAll(
            "[data-thumbnail-file]"
          )
          .forEach(
            element => {

              loadThumbnail(
                element
              );

            }
          );

      }

    }


    /* =====================================================
       LOAD THUMBNAIL

       Fungsi ini TIDAK dipanggil saat
       render semua file.

       Hanya dipanggil ketika thumbnail
       mendekati viewport.
    ===================================================== */

    async function loadThumbnail(
      imageElement
    ) {

      if (!imageElement)
        return;


      const fileName =
        imageElement.dataset
          .thumbnailFile;


      if (!fileName)
        return;


      /*
        Cek cache browser internal.
      */

      const cacheKey =
        `${currentUser.id}/${fileName}`;


      if (
        thumbnailCache.has(cacheKey)
      ) {

        imageElement.src =
          thumbnailCache.get(
            cacheKey
          );

        imageElement.classList.add(
          "loaded"
        );

        const loader =
          imageElement.parentElement
            ?.querySelector(
              ".thumbnail-loading"
            );

        loader?.classList.add(
          "hidden"
        );

        return;

      }


      const url =
        await getThumbnailUrl(
          fileName
        );


      const loader =
        imageElement.parentElement
          ?.querySelector(
            ".thumbnail-loading"
          );


      if (!url) {

        imageElement.classList.add(
          "failed"
        );

        loader?.classList.add(
          "hidden"
        );

        return;

      }


      imageElement.onload =
        () => {

          imageElement.classList.add(
            "loaded"
          );

          loader?.classList.add(
            "hidden"
          );

        };


      imageElement.onerror =
        () => {

          imageElement.classList.add(
            "failed"
          );

          loader?.classList.add(
            "hidden"
          );

        };


      imageElement.src =
        url;

    }


    /* =====================================================
       LOAD FILE LIST

       Bagian ini cepat karena hanya meminta
       metadata/list file dari Supabase.
    ===================================================== */

    async function loadFiles() {

      if (!currentUser)
        return;


      /*
        Jangan menghapus list lama
        sebelum request selesai.

        Jadi refresh terasa lebih halus.
      */

      if (!allFiles.length) {

        fileList.innerHTML = `
          <div class="loading-box">
            <div class="spinner"></div>
            Memuat daftar file...
          </div>
        `;

      }


      try {

        const folder =
          currentUser.id;


        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from(BUCKET)
            .list(
              folder,
              {
                limit: 1000,
                sortBy: {
                  column: "created_at",
                  order: "desc"
                }
              }
            );


        if (error) {
          throw error;
        }


        allFiles =
          (data || [])
            .filter(
              file =>
                file.name !==
                ".emptyFolderPlaceholder"
            );


        /*
          Render langsung.
          Tidak menunggu thumbnail.
        */

        renderFiles(
          getFilteredFiles()
        );

      } catch (error) {

        console.error(error);

        fileList.innerHTML = `
          <div class="bg-red-100 text-red-700 rounded-xl p-4">
            Gagal memuat file:
            ${escapeHtml(error.message)}
          </div>

    }


    /* =====================================================
       FILTER FILE
    ===================================================== */

    function getFilteredFiles() {

      const keyword =
        searchInput.value
          .toLowerCase()
          .trim();


      if (!keyword)
        return allFiles;


      return allFiles.filter(
        file =>
          file.name

      );

    }


    /* =====================================================
       RENDER FILES

       Tidak ada await di sini.

       Jadi daftar file bisa muncul
       jauh lebih cepat.
    ===================================================== */

    function renderFiles(files) {

      /*
        Disconnect observer lama.
      */

      if (
        thumbnailObserver
      ) {

        thumbnailObserver.disconnect();

      }


      fileList.innerHTML = "";


      fileCount.textContent =
        `${files.length} file${files.length !== 1 ? "s" : ""}`;


      if (!files.length) {

        emptyState.classList.remove(
          "hidden"
        );

        return;

      }


      emptyState.classList.add(
        "hidden"
      );


      const fragment =
        document.createDocumentFragment();


      files.forEach(file => {

        const card =
          document.createElement("div");


        card.className =
          "file-card";


        const safeName =
          escapeHtml(file.name);


        const size =
          formatSize(
            file.metadata?.size || 0
          );


        const created =
          formatDate(
            file.created_at ||
            new Date()
          );


        const isImage =
          isImageFile(
            file.name
          );


        /*
          Thumbnail image hanya dibuat
          sebagai elemen HTML.

          URL belum dibuat.
        */

        const thumbnailHtml =
          isImage

            ? `
              <div class="file-thumbnail">

                <div class="thumbnail-loading">
                  ◌
                </div>

                <img
                  class="file-thumbnail-image"
                  data-thumbnail-file="${safeName}"
                  alt="${safeName}"
                  loading="lazy"
                />

              </div>
            `

            : `
              <div class="file-thumbnail">
                <div class="file-icon">
                  ${getFileIcon(file.name)}
                </div>
              </div>
            `;


        card.innerHTML = `

          ${thumbnailHtml}

          <div class="file-info">

            <div
              class="file-name"
              title="${safeName}"
            >
              ${safeName}
            </div>

            <div class="file-meta">
              ${size} • ${created}
            </div>

          </div>

          <div class="file-actions">

            <button
              type="button"
              class="action-btn rename-button"
            >
              ✏️ Rename
            </button>

            <button
              type="button"
              class="action-btn download-button"
            >
              ⬇️ Download
            </button>

            <button
              type="button"
              class="action-btn delete-button"
            >
              🗑️ Hapus
            </button>

          </div>

        `;


        /*
          Rename
        */

        card
          .querySelector(
            ".rename-button"
          )
          .addEventListener(
            "click",
            () =>
              renameFile(
                file.name
              )
          );


        /*
          Download
        */

        card
          .querySelector(
            ".download-button"
          )
          .addEventListener(
            "click",
            () =>
              downloadFile(
                file.name
              )
          );


        /*
          Delete
        */

        card
          .querySelector(
            ".delete-button"
          )
          .addEventListener(
            "click",
            () =>
              deleteFile(
                file.name
              )
          );


        fragment.appendChild(
          card
        );

      });


      /*
        Sekali append saja.

        Ini lebih cepat daripada
        appendChild setiap item langsung
        ke DOM.
      */

      fileList.appendChild(
        fragment
      );


      /*
        Baru setelah semua card selesai
        dibuat, aktifkan lazy thumbnail.
      */

      setupThumbnailObserver();

    }


    /* =====================================================
       MULTI FILE UPLOAD
    ===================================================== */

    async function uploadSingleFile(
      file
    ) {

      if (!currentUser) {

        throw new Error(
          "Silakan login terlebih dahulu."
        );

      }


      if (
        file.size >
        MAX_FILE_SIZE
      ) {

        throw new Error(
          `${file.name} terlalu besar. Maksimal 100 MB.`
        );

      }


      const safeName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      /*
        Nama unik agar tidak bentrok.
      */

      const fileName =
        `${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${safeName}`;


      const filePath =
        `${currentUser.id}/${fileName}`;


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .upload(
            filePath,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType:
                file.type ||
                undefined
            }
          );


      if (error) {
        throw error;
      }


      return fileName;

    }


    /* =====================================================
       UPLOAD FILES
    ===================================================== */

    async function uploadFiles(
      files
    ) {

      if (
        !files.length ||
        isUploading
      ) {

        return;

      }


      if (!currentUser) {

        showUploadMessage(
          "Silakan login terlebih dahulu."
        );

        return;

      }


      /*
        Maksimal 10 file sekali proses.
      */

      if (
        files.length >
        MAX_FILES_PER_UPLOAD
      ) {

        showUploadMessage(
          `Maksimal ${MAX_FILES_PER_UPLOAD} file sekaligus. Kamu memilih ${files.length} file.`,
          "error"
        );

        return;

      }


      isUploading = true;


      const total =
        files.length;


      let completed = 0;
      let successful = 0;
      let failed = 0;


      const errors = [];


      showUploadMessage(
        `Menyiapkan ${total} file...`,
        "loading"
      );


      /*
        Validasi ukuran sebelum upload.
      */

      const validFiles = [];


      files.forEach(file => {

        if (
          file.size >
          MAX_FILE_SIZE
        ) {

          failed++;

          errors.push(
            `${file.name}: melebihi 100 MB`
          );

        } else {

          validFiles.push(file);

        }

      });


      /*
        Worker pool.

        Maksimal 10 upload bersamaan.
      */

      let nextIndex = 0;


      async function worker() {

        while (true) {

          const index =
            nextIndex++;


          if (
            index >=
            validFiles.length
          ) {

            return;

          }


          const file =
            validFiles[index];


          try {

            await uploadSingleFile(
              file
            );


            successful++;

          } catch (error) {

            failed++;


            errors.push(
              `${file.name}: ${error.message || "upload gagal"}`
            );


            console.error(
              `Upload gagal: ${file.name}`,
              error
            );

          } finally {

            completed++;


            showUploadMessage(
              `Mengupload... ${completed}/${validFiles.length} • ${successful} berhasil • ${failed} gagal`,
              "loading"
            );

          }

        }

      }


      const workerCount =
        Math.min(
          MAX_CONCURRENT_UPLOADS,
          validFiles.length
        );


      if (workerCount > 0) {

        await Promise.all(
          Array.from(
            {
              length:
                workerCount
            },
            () =>
              worker()
          )
        );

      }


      const message =
        `Selesai! ${successful} berhasil • ${failed} gagal dari ${total} file.`;


      if (
        failed === 0
      ) {

        showUploadMessage(
          message,
          "success"
        );

      } else if (
        successful > 0
      ) {

        showUploadMessage(
          message,
          "success"
        );

      } else {

        showUploadMessage(
          message,
          "error"
        );

      }


      if (errors.length) {

        console.warn(
          "Detail file gagal:",
          errors
        );

      }


      /*
        Refresh daftar.

        Thumbnail tidak akan langsung
        dibuat semua.
      */

      try {

        await loadFiles();

      } catch (error) {

        console.error(
          "Gagal refresh daftar file:",
          error
        );

      }


      isUploading = false;

    }


    /* =====================================================
       FILE INPUT
    ===================================================== */

    fileInput.addEventListener(
      "change",
      async function () {

        const files =
          Array.from(
            this.files || []
          );


        if (!files.length)
          return;


        await uploadFiles(
          files
        );


        /*
          Reset agar file yang sama
          bisa dipilih lagi.
        */

        this.value = "";

      }
    );


    /* =====================================================
       DRAG & DROP
    ===================================================== */

    if (uploadLabel) {

      [
        "dragenter",
        "dragover"
      ].forEach(
        eventName => {

          uploadLabel.addEventListener(
            eventName,
            event => {

              event.preventDefault();

              event.stopPropagation();

              uploadLabel.classList.add(
                "drag-active"
              );

            }
          );

        }
      );


      [
        "dragleave",
        "drop"
      ].forEach(
        eventName => {

          uploadLabel.addEventListener(
            eventName,
            event => {

              event.preventDefault();

              event.stopPropagation();

              uploadLabel.classList.remove(
                "drag-active"
              );

            }
          );

        }
      );


      uploadLabel.addEventListener(
        "drop",
        async event => {

          const files =
            Array.from(
              event
                .dataTransfer
                .files || []
            );


          if (!files.length)
            return;


          await uploadFiles(
            files
          );

        }
      );

    }


    /* =====================================================
       DOWNLOAD
    ===================================================== */

    async function downloadFile(
      fileName
    ) {

      if (!currentUser)
        return;


      try {

        const filePath =
          `${currentUser.id}/${fileName}`;


        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from(BUCKET)
            .createSignedUrl(
              filePath,
              60 * 60
            );


        if (error)
          throw error;


        if (
          !data?.signedUrl
        ) {

          throw new Error(
            "URL download tidak tersedia."
          );

        }


        const link =
          document.createElement(
            "a"
          );


        link.href =
          data.signedUrl;

        link.target =
          "_blank";

        link.rel =
          "noopener";


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();

      } catch (error) {

        console.error(error);

        alert(
          "Download gagal: " +
          error.message
        );

      }

    }


    /* =====================================================
       RENAME
    ===================================================== */

    async function renameFile(
      oldName
    ) {

      if (!currentUser)
        return;


      const input =
        prompt(
          "Masukkan nama file baru:",
          oldName
        );


      if (
        input === null
      ) {

        return;

      }


      const newName =
        input.trim();


      if (!newName) {

        alert(
          "Nama file tidak boleh kosong."
        );

        return;

      }


      if (
        newName === oldName
      ) {

        return;

      }


      const safeName =
        newName.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      if (!safeName) {

        alert(
          "Nama file tidak valid."
        );

        return;

      }


      const existing =
        allFiles.some(
          file =>
            file.name ===
            safeName
        );


      if (existing) {

        showUploadMessage(
          "Nama file tersebut sudah digunakan.",
          "error"
        );

        return;

      }


      const oldPath =
        `${currentUser.id}/${oldName}`;

      const newPath =
        `${currentUser.id}/${safeName}`;


      try {

        showUploadMessage(
          `Mengganti nama ${oldName}...`,
          "loading"
        );


        const {
          error
        } =
          await supabaseClient
            .storage
            .from(BUCKET)
            .move(
              oldPath,
              newPath
            );


        if (error)
          throw error;


        /*
          Hapus cache thumbnail lama.
        */

        thumbnailCache.delete(
          `${currentUser.id}/${oldName}`
        );


        showUploadMessage(
          `Berhasil mengganti nama menjadi ${safeName}.`,
          "success"
        );


        await loadFiles();

      } catch (error) {

        console.error(error);

        showUploadMessage(
          `Rename gagal: ${error.message}`,
          "error"
        );

      }

    }


    /* =====================================================
       DELETE
    ===================================================== */

    async function deleteFile(
      fileName
    ) {

      if (!currentUser)
        return;


      const confirmed =
        confirm(
          `Hapus file "${fileName}"?`
        );


      if (!confirmed)
        return;


      try {

        const filePath =
          `${currentUser.id}/${fileName}`;


        const {
          error
        } =
          await supabaseClient
            .storage
            .from(BUCKET)
            .remove([
              filePath
            ]);


        if (error)
          throw error;


        /*
          Hapus thumbnail dari cache.
        */

        thumbnailCache.delete(
          `${currentUser.id}/${fileName}`
        );


        /*
          Hapus langsung dari array
          agar UI terasa lebih cepat.
        */

        allFiles =
          allFiles.filter(
            file =>
              file.name !==
              fileName
          );


        renderFiles(
          getFilteredFiles()
        );


        showUploadMessage(
          `File "${fileName}" berhasil dihapus.`,
          "success"
        );

      } catch (error) {

        console.error(error);

        alert(
          "Gagal menghapus file: " +
          error.message
        );

      }

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    searchInput.addEventListener(
      "input",
      () => {

        /*
          Tidak ada request ke Supabase.

          Search dilakukan langsung
          terhadap allFiles di browser.
        */

        renderFiles(
          getFilteredFiles()
        );

      }
    );


    /* =====================================================
       REFRESH
    ===================================================== */

    document
      .getElementById(
        "refreshButton"
      )
      .addEventListener(
        "click",
        async () => {

          const button =
            document.getElementById(
              "refreshButton"
            );


          button.disabled =
            true;


          try {

            await loadFiles();

          } finally {

            button.disabled =
              false;

          }

        }
      );


    /* =====================================================
       AUTH STATE
    ===================================================== */

    supabaseClient
      .auth
      .onAuthStateChange(
        async (
          event,
          session
        ) => {

          if (
            session &&
            session.user
          ) {

            currentUser =
              session.user;


            /*
              Jangan melakukan pekerjaan
              thumbnail di sini.
            */

            await showStoragePage();

          } else {

            currentUser = null;

            allFiles = [];

            thumbnailCache.clear();


            storagePage.classList.add(
              "hidden"
            );

            authPage.classList.remove(
              "hidden"
            );

          }

        }
      );


    /* =====================================================
       START
    ===================================================== */

    loadUser();

  </script>

</body>
</html>
