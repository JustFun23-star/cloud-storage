    "sb_publishable_VxFQ1sUpf4-wjEpzhg4IMg_c_scLRSQ";

     SETTINGS

  /* =====================================================

  /* =====================================================
     AUTH MESSAGE
  ===================================================== */

  function showAuthMessage(

  ) {

        "bg-green-100",

  /* =====================================================
     UPLOAD MESSAGE
  ===================================================== */

  ) {

      "hidden",

      "text-red-700",

      "text-green-700",

  /* =====================================================
     LOGIN
  ===================================================== */

  document
    .getElementById("loginButton")
    .addEventListener(
      "click",
      async () => {

        const email =
          document
            .getElementById(
              "loginEmail"
            )

            .trim();

            .getElementById(
              "loginPassword"
            )

          await supabaseClient.auth.signInWithPassword({

  ===================================================== */

  /* =====================================================
     LOAD USER
  ===================================================== */

  async function loadUser() {

    const {
      data
    } =
      await supabaseClient
        .auth
        .getSession();

    if (
      data &&
      data.session &&
      data.session.user
    ) {

      currentUser =
        data.session.user;

      await showStoragePage();

    } else {

      currentUser = null;

      storagePage.classList.add(
        "hidden"
      );

      authPage.classList.remove(
        "hidden"
      );

    }

  }


  /* =====================================================
     SHOW STORAGE PAGE
  ===================================================== */

  async function showStoragePage() {

    authPage.classList.add(
      "hidden"
    );

    storagePage.classList.remove(
      "hidden"
    );

    document
      .getElementById("userEmail")
      .textContent =
        currentUser.email || "";

    await loadFiles();

  }


  /* =====================================================
     FORMAT SIZE
  ===================================================== */

  function formatSize(bytes) {

    if (!bytes) {
      return "0 B";
    }

    const units = [
      "B",
      "KB",
      "MB",
      "GB",
      "TB"
    ];

    const index =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );

    return (
      parseFloat(
        (
          bytes /
          Math.pow(
            1024,
            index
          )
        ).toFixed(2)
      ) +
      " " +
      units[index]
    );

  }


  /* =====================================================
     FORMAT DATE
  ===================================================== */

  function formatDate(date) {

    try {

      return new Date(date)
        .toLocaleString(
          "id-ID",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        );

    } catch {

      return "-";

    }

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =====================================================
     FILE ICON
  ===================================================== */

  function getFileIcon(fileName) {

    const extension =
      fileName
        .split(".")
        .pop()
        .toLowerCase();

    const icons = {

      jpg: "🖼️",
      jpeg: "🖼️",
      png: "🖼️",
      gif: "🖼️",
      webp: "🖼️",
      svg: "🖼️",

      mp4: "🎬",
      mov: "🎬",
      avi: "🎬",
      mkv: "🎬",

      mp3: "🎵",
      wav: "🎵",
      ogg: "🎵",

      pdf: "📕",

      doc: "📘",
      docx: "📘",

      xls: "📗",
      xlsx: "📗",

      ppt: "📙",
      pptx: "📙",

      zip: "🗜️",
      rar: "🗜️",
      "7z": "🗜️",

      txt: "📄",
      csv: "📊",

      html: "🌐",
      css: "🎨",
      js: "📜"

    };

    return (
      icons[extension] ||
      "📄"
    );

  }


  /* =====================================================
     LOAD FILES
  ===================================================== */

  async function loadFiles() {

    if (!currentUser) {
      return;
    }

    fileList.innerHTML = `
      <div class="bg-white rounded-xl p-6 text-center text-gray-400">
        Memuat file...
      </div>
    `;

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .list(
          currentUser.id,
          {
            limit: 1000,
            offset: 0,
            sortBy: {
              column: "created_at",
              order: "desc"
            }
          }
        );

    if (error) {

      console.error(error);

      fileList.innerHTML = `
        <div class="bg-red-100 text-red-700 rounded-xl p-4">
          Gagal memuat file:
          ${escapeHtml(error.message)}
        </div>
      `;

      return;

    }

    allFiles =
      (data || [])
        .filter(
          file =>
            file.name !==
            ".emptyFolderPlaceholder"
        );

    renderFiles(
      allFiles
    );

  }


  /* =====================================================
     RENDER FILES
  ===================================================== */

    fileList.innerHTML = "";

    fileCount.textContent =
      `${files.length} file${
        files.length !== 1
          ? "s"
          : ""
      }`;

    if (files.length === 0) {

      emptyState.classList.remove(

      );

      return;

    }

    emptyState.classList.add(

    );


    files.forEach(

        card.innerHTML = `

          <div class="text-3xl flex-shrink-0">
            ${getFileIcon(file.name)}
          </div>

          <div class="flex-1 min-w-0">

            <div
              class="font-semibold text-gray-800 truncate"
              title="${name}"
            >
              ${name}
            </div>

            <div class="text-xs text-gray-400 mt-1">

            </div>

          </div>

          <div class="flex gap-2 flex-shrink-0 flex-wrap justify-end">

            <button
              class="renameButton bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded-lg text-sm"
            >
              Rename
            </button>

            <button
              class="downloadButton bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm"
            >
              Download
            </button>

            <button
              class="deleteButton bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm"

              Hapus
            </button>

          </div>
        `;


        card
          .querySelector(
            ".renameButton"
          )
          .addEventListener(
            "click",
            () =>
              renameFile(
                file.name

          );


        card
          .querySelector(
            ".downloadButton"
          )

            "click",

                file.name

              )
          );


        fileList.appendChild(
          card
        );

      }
    );

  }


  /* =====================================================
     UPLOAD SATU FILE
  ===================================================== */

  async function uploadSingleFile(
    file
  ) {

    if (!currentUser) {

      throw new Error(
        "Silakan login terlebih dahulu."
      );

    }


    if (
      file.size >
      MAX_FILE_SIZE
    ) {

      throw new Error(
        `${file.name} terlalu besar. Maksimal 100 MB.`
      );

    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const fileName =
      `${Date.now()}_${Math.random()
        .toString(36)
        .slice(2, 8)}_${safeName}`;


    const filePath =
      `${currentUser.id}/${fileName}`;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              file.type ||
              undefined
          }
        );


    if (error) {
      throw error;
    }


    return fileName;

  }


  /* =====================================================
     UPLOAD MAKSIMAL 10 FILE SEKALIGUS
  ===================================================== */

  async function uploadFiles(
    files
  ) {

    if (
      !files.length ||
      isUploading
    ) {
      return;
    }


    if (!currentUser) {

      showUploadMessage(
        "Silakan login terlebih dahulu."
      );

      return;

    }


    /*
      Batasi maksimal 10 file
      dalam satu proses.
    */

    if (
      files.length >
      MAX_FILES_PER_UPLOAD
    ) {

      showUploadMessage(
        `Maksimal ${MAX_FILES_PER_UPLOAD} file sekaligus. Kamu memilih ${files.length} file.`,
        "error"
      );

      return;

    }


    isUploading = true;


    const total =
      files.length;

    let completed = 0;
    let successful = 0;
    let failed = 0;

    const errors = [];


    showUploadMessage(
      `Menyiapkan ${total} file...`,
      "loading"
    );


    /*
      Validasi ukuran file.
    */

    const validFiles = [];


    files.forEach(
      file => {

        if (
          file.size >
          MAX_FILE_SIZE
        ) {

          failed++;

          errors.push(
            `${file.name}: melebihi 100 MB`
          );

        } else {

          validFiles.push(
            file
          );

        }

      }
    );


    /*
      Maksimal 10 upload
      berjalan bersamaan.
    */

    let nextIndex = 0;


    async function worker() {

      while (true) {

        const index =
          nextIndex++;


        if (
          index >=
          validFiles.length
        ) {

          return;

        }


        const file =
          validFiles[index];


        try {

          await uploadSingleFile(
            file
          );

          successful++;


        } catch (error) {

          failed++;

          errors.push(
            `${file.name}: ${
              error.message ||
              "upload gagal"
            }`
          );


          console.error(
            `Upload gagal: ${file.name}`,
            error
          );


        } finally {

          completed++;


          showUploadMessage(
            `Mengupload... ${completed}/${validFiles.length} • ${successful} berhasil • ${failed} gagal`,
            "loading"
          );

        }

      }

    }


    const workerCount =
      Math.min(
        MAX_CONCURRENT_UPLOADS,
        validFiles.length
      );


    await Promise.all(

      Array.from(
        {
          length:
            workerCount
        },
        () =>
          worker()
      )

    );


    /*
      Hasil upload.
    */

    const message =
      `Selesai! ${successful} berhasil • ${failed} gagal dari ${total} file.`;


    if (
      failed === 0
    ) {

      showUploadMessage(
        message,
        "success"
      );

    } else if (
      successful > 0
    ) {

      showUploadMessage(
        message,
        "success"
      );

    } else {

      showUploadMessage(
        message,
        "error"
      );

    }


    if (
      errors.length
    ) {

      console.warn(
        "Detail file yang gagal:",
        errors
      );

    }


    try {

      await loadFiles();

    } catch (error) {

      console.error(
        "Gagal refresh daftar file:",
        error
      );

    }


    isUploading = false;

  }

  );


  /* =====================================================
     DRAG & DROP
  ===================================================== */

  const uploadLabel =
    fileInput.closest(
      "label"
    );


  if (uploadLabel) {

    [
      "dragenter",
      "dragover"
    ].forEach(
      eventName => {

        uploadLabel.addEventListener(
          eventName,
          event => {

            event.preventDefault();
            event.stopPropagation();

            uploadLabel.classList.add(
              "border-blue-500",
              "bg-blue-50"
            );

          }
        );

      }
    );


    [
      "dragleave",
      "drop"
    ].forEach(
      eventName => {

        uploadLabel.addEventListener(
          eventName,
          event => {

            event.preventDefault();
            event.stopPropagation();

            uploadLabel.classList.remove(
              "border-blue-500",
              "bg-blue-50"
            );

          }
        );

      }
    );


    uploadLabel.addEventListener(
      "drop",
      async event => {

        const files =
          Array.from(
            event
              .dataTransfer
              .files || []
          );


        if (!files.length) {
          return;
        }


        await uploadFiles(
          files
        );

      }
    );

  }


  /* =====================================================
     DOWNLOAD
  ===================================================== */

  async function downloadFile(
    fileName
  ) {

    try {

      const filePath =
        `${currentUser.id}/${fileName}`;


      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .createSignedUrl(
            filePath,
            60 * 60
          );


      if (error) {
        throw error;
      }


      window.open(
        data.signedUrl,
        "_blank"
      );


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Download gagal: " +
        error.message
      );

    }

  }


  /* =====================================================
     RENAME FILE
  ===================================================== */

  async function renameFile(
    oldName
  ) {

    if (!currentUser) {
      return;
    }


    const input =
      prompt(
        "Masukkan nama file baru:",
        oldName
      );


    if (input === null) {
      return;
    }


    const newName =
      input.trim();


    if (!newName) {

      alert(
        "Nama file tidak boleh kosong."
      );

      return;

    }


    if (
      newName ===
      oldName
    ) {

      return;

    }


    const safeName =
      newName.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    if (!safeName) {

      alert(
        "Nama file tidak valid."
      );

      return;

    }


    const oldPath =
      `${currentUser.id}/${oldName}`;

    const newPath =
      `${currentUser.id}/${safeName}`;


    try {

      showUploadMessage(
        `Mengganti nama ${oldName}...`,
        "loading"
      );


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .move(
            oldPath,
            newPath
          );


      if (error) {
        throw error;
      }


      showUploadMessage(
        `Berhasil mengganti nama menjadi ${safeName}.`,
        "success"
      );


      await loadFiles();


    } catch (error) {

      console.error(
        error
      );


      showUploadMessage(
        `Rename gagal: ${error.message}`,
        "error"
      );

    }

  }


  /* =====================================================
     DELETE
  ===================================================== */

  async function deleteFile(
    fileName
  ) {

    if (
      !confirm(
        `Hapus file "${fileName}"?`
      )
    ) {

      return;

    }


    try {

      const filePath =
        `${currentUser.id}/${fileName}`;


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .remove([
            filePath
          ]);


      if (error) {
        throw error;
      }


      await loadFiles();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Gagal menghapus file: " +
        error.message
      );

    }

  }


  /* =====================================================
     SEARCH
  ===================================================== */

  searchInput.addEventListener(
    "input",
    function () {

      const keyword =
        this.value
          .toLowerCase()
          .trim();


      if (!keyword) {

        renderFiles(
          allFiles
        );

        return;

      }


      const filtered =
        allFiles.filter(
          file =>
            file.name
              .toLowerCase()
              .includes(
                keyword
              )
        );


      renderFiles(
        filtered
      );

    }
  );


  /* =====================================================
     REFRESH
  ===================================================== */

  document
    .getElementById(
      "refreshButton"
    )
    .addEventListener(
      "click",
      loadFiles
    );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  supabaseClient
    .auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        if (
          session &&
          session.user
        ) {

          currentUser =
            session.user;

          await showStoragePage();

        } else {

          currentUser =
            null;

          storagePage.classList.add(
            "hidden"
          );

          authPage.classList.remove(
            "hidden"
          );

        }

      }
    );


  /* =====================================================
     START
  ===================================================== */

  loadUser();

</script>

</body>
</html>
