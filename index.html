<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Storage</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.drop-zone {
    border: 2px dashed #3b82f6;
    transition: 0.3s;
}
.drop-zone.dragover {
    background: #dbeafe;
}
</style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-5xl mx-auto p-6">

    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-bold text-blue-600">
            Cloud Storage
        </h1>
    </div>

    <div id="dropZone"
         class="drop-zone bg-white rounded-xl p-10 text-center shadow">

        <p class="text-lg font-semibold">
            Drag & Drop File
        </p>

        <p class="text-gray-500 mb-4">
            atau klik tombol di bawah
        </p>

        <input
            type="file"
            id="fileInput"
            class="hidden">

        <button
            onclick="fileInput.click()"
            class="bg-blue-600 text-white px-5 py-2 rounded-lg">
            Pilih File
        </button>

        <div id="loading"
             class="hidden mt-4 text-blue-600 font-semibold">
             Uploading...
        </div>

    </div>

    <div class="mt-6">
        <input
            type="text"
            id="search"
            placeholder="Cari file..."
            class="w-full p-3 rounded-lg border">
    </div>

    <div class="mt-6 bg-white rounded-xl shadow overflow-hidden">

        <table class="w-full">

            <thead class="bg-gray-50">
            <tr>
                <th class="text-left p-4">Nama</th>
                <th class="text-left p-4">Ukuran</th>
                <th class="text-left p-4">Tanggal</th>
                <th class="text-left p-4">Aksi</th>
            </tr>
            </thead>

            <tbody id="fileList">
            </tbody>

        </table>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://jbrrlophgrdqniorjkjn.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_VxFQ1sUpf4-wjEpzhg4IMg_c_scLRSQ";

const BUCKET = "files";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const fileInput =
document.getElementById("fileInput");

const loading =
document.getElementById("loading");

const dropZone =
document.getElementById("dropZone");

const fileList =
document.getElementById("fileList");

const search =
document.getElementById("search");

let filesCache = [];

fileInput.addEventListener(
"change",
e => uploadFile(e.target.files[0])
);

dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");

    const file =
    e.dataTransfer.files[0];

    if(file) uploadFile(file);
});

async function uploadFile(file){

    loading.classList.remove("hidden");

    const filename =
    Date.now() + "_" + file.name;

    const { error } =
    await supabase.storage
    .from(BUCKET)
    .upload(filename, file);

    loading.classList.add("hidden");

    if(error){
        alert(error.message);
        return;
    }

    loadFiles();
}

function formatSize(bytes){

    if(bytes < 1024)
        return bytes + " B";

    if(bytes < 1048576)
        return (bytes/1024).toFixed(1)+" KB";

    if(bytes < 1073741824)
        return (bytes/1048576).toFixed(1)+" MB";

    return (bytes/1073741824).toFixed(1)+" GB";
}

function getIcon(name){

    const ext =
    name.split(".").pop().toLowerCase();

    if(["jpg","jpeg","png","gif","webp"].includes(ext))
        return "🖼️";

    if(ext==="pdf")
        return "📕";

    if(["doc","docx"].includes(ext))
        return "📄";

    if(["zip","rar","7z"].includes(ext))
        return "🗜️";

    return "📁";
}

async function loadFiles(){

    const { data, error } =
    await supabase.storage
    .from(BUCKET)
    .list("", {
        limit: 1000
    });

    if(error){
        console.log(error);
        return;
    }

    filesCache = data;
    renderFiles(data);
}

function renderFiles(files){

    fileList.innerHTML = "";

    files.forEach(file => {

        const url =
        supabase.storage
        .from(BUCKET)
        .getPublicUrl(file.name)
        .data.publicUrl;

        const tr =
        document.createElement("tr");

        tr.className =
        "border-t";

        tr.innerHTML = `
        <td class="p-4">
            ${getIcon(file.name)}
            ${file.name}
        </td>

        <td class="p-4">
            ${formatSize(file.metadata?.size || 0)}
        </td>

        <td class="p-4">
            ${new Date(
            file.created_at
            ).toLocaleString()}
        </td>

        <td class="p-4 flex gap-2">

            <a
              href="${url}"
              download
              target="_blank"
              class="bg-green-600 text-white px-3 py-1 rounded">
              Download
            </a>

            <button
              onclick="deleteFile('${file.name}')"
              class="bg-red-600 text-white px-3 py-1 rounded">
              Hapus
            </button>

        </td>
        `;

        fileList.appendChild(tr);

    });
}

async function deleteFile(name){

    if(!confirm(
        "Hapus file ini?"
    )) return;

    const { error } =
    await supabase.storage
    .from(BUCKET)
    .remove([name]);

    if(error){
        alert(error.message);
        return;
    }

    loadFiles();
}

search.addEventListener(
"input",
e => {

    const keyword =
    e.target.value.toLowerCase();

    const filtered =
    filesCache.filter(file =>
        file.name
        .toLowerCase()
        .includes(keyword)
    );

    renderFiles(filtered);

});

loadFiles();

</script>

</body>
</html>
