<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Cloud Storage</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(
          135deg,
          #f8fafc 0%,
          #eef2ff 50%,
          #f8fafc 100%
        );
      color: #1e293b;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* ================================
       STORAGE PAGE
    ================================= */

    #storagePage {
      min-height: 100vh;
    }

    /* ================================
       HEADER
    ================================= */

    .main-header {
      position: sticky;
      top: 0;
      z-index: 50;

      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-bottom: 1px solid #e2e8f0;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 16px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 44px;
      height: 44px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;
      font-size: 22px;

      box-shadow:
        0 8px 20px
        rgba(37, 99, 235, 0.25);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }

    .brand-email {
      margin-top: 3px;

      font-size: 12px;
      color: #64748b;

      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      border: none;
      cursor: pointer;

      padding: 10px 15px;

      border-radius: 10px;

      background: #fee2e2;
      color: #dc2626;

      font-weight: 700;
      font-size: 13px;

      transition: 0.2s;
    }

    .logout-btn:hover {
      background: #fecaca;
      transform: translateY(-1px);
    }

    /* ================================
       MAIN
    ================================= */

    .main-container {
      max-width: 1100px;
      margin: auto;

      padding:
        28px 20px
        50px;
    }

    /* ================================
       UPLOAD CARD
    ================================= */

    .upload-card {
      background: rgba(255,255,255,0.94);

      border: 1px solid #e2e8f0;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 10px 35px
        rgba(15, 23, 42, 0.06);

      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;

      color: #0f172a;

      margin-bottom: 5px;
    }

    .section-description {
      font-size: 13px;
      color: #64748b;

      margin-bottom: 17px;
    }

    .upload-label {
      display: block;

      border: 2px dashed #cbd5e1;

      border-radius: 16px;

      padding: 32px 20px;

      text-align: center;

      cursor: pointer;

      background:
        linear-gradient(
          180deg,
          #ffffff,
          #f8fafc
        );

      transition:
        border-color .2s,
        background .2s,
        transform .2s;
    }

    .upload-label:hover {
      border-color: #3b82f6;

      background: #eff6ff;

      transform: translateY(-1px);
    }

    .upload-icon {
      width: 58px;
      height: 58px;

      margin: auto auto 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background: #dbeafe;

      font-size: 28px;
    }

    .upload-main-text {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
    }

    .upload-sub-text {
      font-size: 12px;
      color: #94a3b8;

      margin-top: 5px;
    }

    /* ================================
       STATUS
    ================================= */

    #uploadStatus {
      border-radius: 12px;

      margin-top: 15px;

      font-size: 13px;
      font-weight: 600;
    }

    /* ================================
       SEARCH
    ================================= */

    .search-card {
      background: rgba(255,255,255,0.94);

      border: 1px solid #e2e8f0;

      border-radius: 16px;

      padding: 12px;

      margin-bottom: 22px;

      box-shadow:
        0 6px 25px
        rgba(15, 23, 42, 0.04);
    }

    .search-wrapper {
      display: flex;
      gap: 9px;
    }

    .search-input {
      flex: 1;

      min-width: 0;

      border: 1px solid #e2e8f0;

      background: #f8fafc;

      border-radius: 11px;

      padding: 12px 14px;

      outline: none;

      font-size: 14px;

      transition: .2s;
    }

    .search-input:focus {
      border-color: #60a5fa;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(59,130,246,.1);
    }

    .refresh-btn {
      width: 46px;

      border: none;

      border-radius: 11px;

      cursor: pointer;

      background: #0f172a;

      color: white;

      font-size: 20px;

      transition: .2s;
    }

    .refresh-btn:hover {
      background: #1e293b;

      transform: rotate(20deg);
    }

    /* ================================
       FILE HEADER
    ================================= */

    .files-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;

      padding: 0 3px;
    }

    .files-title {
      font-size: 17px;
      font-weight: 800;

      color: #0f172a;
    }

    .files-count {
      font-size: 12px;

      color: #64748b;

      background: #e2e8f0;

      padding: 5px 9px;

      border-radius: 999px;
    }

    /* ================================
       FILE LIST
    ================================= */

    #fileList {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .file-card {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 15px;

      padding: 13px;

      background: rgba(255,255,255,.96);

      border: 1px solid #e2e8f0;

      border-radius: 16px;

      box-shadow:
        0 5px 20px
        rgba(15,23,42,.04);

      transition:
        transform .2s,
        box-shadow .2s,
        border-color .2s;
    }

    .file-card:hover {
      transform: translateY(-2px);

      border-color: #bfdbfe;

      box-shadow:
        0 10px 28px
        rgba(15,23,42,.08);
    }

    /* ================================
       THUMBNAIL
    ================================= */

    .file-thumbnail {
      width: 120px;
      height: 90px;

      flex: 0 0 120px;

      border-radius: 12px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #eff6ff,
          #e0e7ff
        );

      border: 1px solid #dbeafe;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    .file-thumbnail img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      opacity: 0;

      transition:
        opacity .25s;
    }

    .file-thumbnail img.loaded {
      opacity: 1;
    }

    .file-icon {
      font-size: 35px;

      user-select: none;
    }

    /* ================================
       FILE INFORMATION
    ================================= */

    .file-info {
      flex: 1;

      min-width: 0;
    }

    .file-name {
      color: #0f172a;

      font-size: 14px;

      font-weight: 750;

      line-height: 1.4;

      word-break: break-word;

      margin-bottom: 5px;
    }

    .file-meta {
      color: #94a3b8;

      font-size: 11px;

      line-height: 1.5;
    }

    /* ================================
       ACTION BUTTONS
    ================================= */

    .file-actions {
      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 7px;

      flex-wrap: wrap;
    }

    .action-btn {
      border: none;

      cursor: pointer;

      padding: 9px 11px;

      border-radius: 9px;

      font-size: 12px;

      font-weight: 750;

      white-space: nowrap;

      transition:
        transform .15s,
        opacity .15s;
    }

    .action-btn:hover {
      transform: translateY(-1px);

      opacity: .9;
    }

    .rename-btn {
      background: #fef3c7;
      color: #b45309;
    }

    .download-btn {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    /* ================================
       EMPTY STATE
    ================================= */

    .empty-state {
      background: white;

      border: 1px solid #e2e8f0;

      border-radius: 18px;

      padding: 45px 20px;

      text-align: center;

      box-shadow:
        0 5px 20px
        rgba(15,23,42,.04);
    }

    .empty-icon {
      font-size: 45px;

      margin-bottom: 8px;
    }

    .empty-title {
      font-size: 15px;

      font-weight: 800;

      color: #334155;
    }

    .empty-text {
      font-size: 12px;

      color: #94a3b8;

      margin-top: 5px;
    }

    /* ================================
       LOADING
    ================================= */

    .loading-card {
      background: white;

      border: 1px solid #e2e8f0;

      border-radius: 16px;

      padding: 25px;

      text-align: center;

      color: #94a3b8;

      font-size: 13px;
    }

    .spinner {
      width: 24px;
      height: 24px;

      margin: 0 auto 9px;

      border: 3px solid #dbeafe;

      border-top-color: #2563eb;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 700px) {

      .main-container {
        padding:
          20px 12px
          35px;
      }

      .header-inner {
        padding:
          12px;
      }

      .brand-icon {
        width: 39px;
        height: 39px;

        font-size: 19px;
      }

      .brand-title {
        font-size: 15px;
      }

      .brand-email {
        max-width: 180px;
      }

      .logout-btn {
        padding: 8px 10px;
      }

      .upload-card {
        padding: 16px;
      }

      .upload-label {
        padding: 25px 15px;
      }

      .file-card {
        align-items: flex-start;

        flex-wrap: wrap;

        gap: 12px;
      }

      .file-thumbnail {
        width: 90px;
        height: 72px;

        flex-basis: 90px;
      }

      .file-info {
        padding-top: 2px;
      }

      .file-actions {
        width: 100%;

        padding-left: 102px;

        justify-content: flex-start;
      }

      .action-btn {
        flex: 0 0 auto;

        padding: 8px 10px;
      }

    }

    /* ================================
       VERY SMALL SCREEN
    ================================= */

    @media (max-width: 420px) {

      .brand-email {
        max-width: 125px;
      }

      .file-thumbnail {
        width: 75px;
        height: 62px;

        flex-basis: 75px;
      }

      .file-actions {
        padding-left: 0;

        justify-content: stretch;
      }

      .file-actions .action-btn {
        flex: 1;
      }

      .file-name {
        font-size: 13px;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================================
       LOGIN / REGISTER
  ====================================================== -->

  <div
    id="authPage"
    class="min-h-screen flex items-center justify-center p-4"
  >

    <div
      class="bg-white w-full max-w-md rounded-2xl shadow-lg p-7"
    >

      <div class="text-center mb-6">

        <div class="text-5xl mb-3">
          ☁️
        </div>

        <h1 class="text-2xl font-bold text-gray-800">
          My Cloud Storage
        </h1>

        <p class="text-gray-500 mt-1">
          Simpan file kamu dengan aman
        </p>

      </div>


      <!-- LOGIN -->

      <div id="loginForm">

        <h2 class="text-xl font-semibold mb-4">
          Login
        </h2>

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button
          id="loginButton"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg"
        >
          Login
        </button>

        <p class="text-center text-sm text-gray-500 mt-5">

          Belum punya akun?

          <button
            id="showRegister"
            class="text-blue-600 font-semibold"
          >
            Daftar
          </button>

        </p>

      </div>


      <!-- REGISTER -->

      <div
        id="registerForm"
        class="hidden"
      >

        <h2 class="text-xl font-semibold mb-4">
          Buat Akun
        </h2>

        <input
          id="registerEmail"
          type="email"
          placeholder="Email"
          class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <input
          id="registerPassword"
          type="password"
          placeholder="Password minimal 6 karakter"
          class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button
          id="registerButton"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg"
        >
          Daftar
        </button>

        <p class="text-center text-sm text-gray-500 mt-5">

          Sudah punya akun?

          <button
            id="showLogin"
            class="text-blue-600 font-semibold"
          >
            Login
          </button>

        </p>

      </div>


      <div
        id="authMessage"
        class="hidden mt-4 p-3 rounded-lg text-sm"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       STORAGE
  ====================================================== -->

  <div
    id="storagePage"
    class="hidden"
  >

    <!-- HEADER -->

    <header class="main-header">

      <div class="header-inner">

        <div class="brand">

          <div class="brand-icon">
            ☁️
          </div>

          <div>

            <div class="brand-title">
              My Cloud Storage
            </div>

            <div
              id="userEmail"
              class="brand-email"
            ></div>

          </div>

        </div>


        <button
          id="logoutButton"
          class="logout-btn"
        >
          Logout
        </button>

      </div>

    </header>


    <!-- MAIN -->

    <main class="main-container">


      <!-- =================================================
           UPLOAD
      ================================================== -->

      <section class="upload-card">

        <div class="section-title">
          Upload File
        </div>

        <div class="section-description">
          Maksimal
          <b>10 file sekaligus</b>
          • maksimal
          <b>100 MB per file</b>
        </div>


        <label
          id="uploadLabel"
          for="fileInput"
          class="upload-label"
        >

          <div class="upload-icon">
            📤
          </div>

          <div class="upload-main-text">
            Klik untuk memilih banyak file
          </div>

          <div class="upload-sub-text">
            atau drag & drop maksimal 10 file di sini
          </div>


          <input
            id="fileInput"
            type="file"
            class="hidden"
            multiple
          />

        </label>


        <div
          id="uploadStatus"
          class="hidden p-3"
        ></div>

      </section>


      <!-- =================================================
           SEARCH
      ================================================== -->

      <section class="search-card">

        <div class="search-wrapper">

          <input
            id="searchInput"
            type="text"
            placeholder="🔎 Cari file..."
            class="search-input"
          />

          <button
            id="refreshButton"
            class="refresh-btn"
            title="Refresh"
          >
            ↻
          </button>

        </div>

      </section>


      <!-- =================================================
           FILE HEADER
      ================================================== -->

      <div class="files-header">

        <div class="files-title">
          File Saya
        </div>

        <div
          id="fileCount"
          class="files-count"
        >
          0 file
        </div>

      </div>


      <!-- =================================================
           FILE LIST
      ================================================== -->

      <div id="fileList"></div>


      <!-- EMPTY -->

      <div
        id="emptyState"
        class="empty-state hidden"
      >

        <div class="empty-icon">
          📂
        </div>

        <div class="empty-title">
          Belum ada file
        </div>

        <div class="empty-text">
          Upload file pertama kamu.
        </div>

      </div>

    </main>

  </div>


<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://jbrrlophgrdqniorjkjn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_VxFQ1sUpf4-wjEpzhg4IMg_c_scLRSQ";

  const BUCKET =
    "file-storage";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     SETTINGS
  ===================================================== */

  const MAX_FILE_SIZE =
    100 * 1024 * 1024;

  const MAX_FILES_PER_UPLOAD =
    10;

  const MAX_CONCURRENT_UPLOADS =
    10;


  let currentUser =
    null;

  let allFiles =
    [];

  let isUploading =
    false;


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const authPage =
    document.getElementById(
      "authPage"
    );

  const storagePage =
    document.getElementById(
      "storagePage"
    );

  const loginForm =
    document.getElementById(
      "loginForm"
    );

  const registerForm =
    document.getElementById(
      "registerForm"
    );

  const authMessage =
    document.getElementById(
      "authMessage"
    );

  const fileInput =
    document.getElementById(
      "fileInput"
    );

  const fileList =
    document.getElementById(
      "fileList"
    );

  const emptyState =
    document.getElementById(
      "emptyState"
    );

  const fileCount =
    document.getElementById(
      "fileCount"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );

  const uploadStatus =
    document.getElementById(
      "uploadStatus"
    );

  const uploadLabel =
    document.getElementById(
      "uploadLabel"
    );


  /* =====================================================
     AUTH MESSAGE
  ===================================================== */

  function showAuthMessage(
    message,
    type = "error"
  ) {

    authMessage.textContent =
      message;

    authMessage.classList.remove(
      "hidden",
      "bg-red-100",
      "text-red-700",
      "bg-green-100",
      "text-green-700"
    );


    if (
      type === "success"
    ) {

      authMessage.classList.add(
        "bg-green-100",
        "text-green-700"
      );

    } else {

      authMessage.classList.add(
        "bg-red-100",
        "text-red-700"
      );

    }

  }


  /* =====================================================
     UPLOAD MESSAGE
  ===================================================== */

  function showUploadMessage(
    message,
    type = "error"
  ) {

    uploadStatus.textContent =
      message;

    uploadStatus.classList.remove(
      "hidden",
      "bg-red-100",
      "text-red-700",
      "bg-green-100",
      "text-green-700",
      "bg-blue-100",
      "text-blue-700"
    );


    if (
      type === "success"
    ) {

      uploadStatus.classList.add(
        "bg-green-100",
        "text-green-700"
      );

    } else if (
      type === "loading"
    ) {

      uploadStatus.classList.add(
        "bg-blue-100",
        "text-blue-700"
      );

    } else {

      uploadStatus.classList.add(
        "bg-red-100",
        "text-red-700"
      );

    }

  }


  /* =====================================================
     LOGIN / REGISTER SWITCH
  ===================================================== */

  document
    .getElementById(
      "showRegister"
    )
    .addEventListener(
      "click",
      () => {

        loginForm.classList.add(
          "hidden"
        );

        registerForm.classList.remove(
          "hidden"
        );

        authMessage.classList.add(
          "hidden"
        );

      }
    );


  document
    .getElementById(
      "showLogin"
    )
    .addEventListener(
      "click",
      () => {

        registerForm.classList.add(
          "hidden"
        );

        loginForm.classList.remove(
          "hidden"
        );

        authMessage.classList.add(
          "hidden"
        );

      }
    );


  /* =====================================================
     REGISTER
  ===================================================== */

  document
    .getElementById(
      "registerButton"
    )
    .addEventListener(
      "click",
      async () => {

        const email =
          document
            .getElementById(
              "registerEmail"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "registerPassword"
            )
            .value;


        if (
          !email ||
          !password
        ) {

          showAuthMessage(
            "Email dan password wajib diisi."
          );

          return;

        }


        if (
          password.length < 6
        ) {

          showAuthMessage(
            "Password minimal 6 karakter."
          );

          return;

        }


        const {
          error
        } =
          await supabaseClient
            .auth
            .signUp({
              email,
              password
            });


        if (error) {

          showAuthMessage(
            error.message
          );

          return;

        }


        showAuthMessage(
          "Pendaftaran berhasil. Silakan cek email untuk verifikasi.",
          "success"
        );

      }
    );


  /* =====================================================
     LOGIN
  ===================================================== */

  document
    .getElementById(
      "loginButton"
    )
    .addEventListener(
      "click",
      async () => {

        const email =
          document
            .getElementById(
              "loginEmail"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "loginPassword"
            )
            .value;


        if (
          !email ||
          !password
        ) {

          showAuthMessage(
            "Email dan password wajib diisi."
          );

          return;

        }


        const {
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {

          showAuthMessage(
            error.message
          );

          return;

        }

      }
    );


  /* =====================================================
     LOGOUT
  ===================================================== */

  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        await supabaseClient
          .auth
          .signOut();

      }
    );


  /* =====================================================
     LOAD USER
  ===================================================== */

  async function loadUser() {

    const {
      data
    } =
      await supabaseClient
        .auth
        .getSession();


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      currentUser =
        data.session.user;

      await showStoragePage();

    } else {

      currentUser =
        null;

      storagePage.classList.add(
        "hidden"
      );

      authPage.classList.remove(
        "hidden"
      );

    }

  }


  /* =====================================================
     SHOW STORAGE
  ===================================================== */

  async function showStoragePage() {

    authPage.classList.add(
      "hidden"
    );

    storagePage.classList.remove(
      "hidden"
    );


    document
      .getElementById(
        "userEmail"
      )
      .textContent =
        currentUser.email || "";


    await loadFiles();

  }


  /* =====================================================
     FORMAT SIZE
  ===================================================== */

  function formatSize(
    bytes
  ) {

    if (!bytes) {
      return "0 B";
    }


    const units = [
      "B",
      "KB",
      "MB",
      "GB",
      "TB"
    ];


    const index =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );


    return (
      parseFloat(
        (
          bytes /
          Math.pow(
            1024,
            index
          )
        ).toFixed(2)
      ) +
      " " +
      units[index]
    );

  }


  /* =====================================================
     FORMAT DATE
  ===================================================== */

  function formatDate(
    date
  ) {

    try {

      return new Date(date)
        .toLocaleString(
          "id-ID",
          {
            dateStyle:
              "medium",

            timeStyle:
              "short"
          }
        );

    } catch {

      return "-";

    }

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =====================================================
     FILE ICON
  ===================================================== */

  function getFileIcon(
    fileName
  ) {

    const extension =
      fileName
        .split(".")
        .pop()
        .toLowerCase();


    const icons = {

      jpg: "🖼️",
      jpeg: "🖼️",
      png: "🖼️",
      gif: "🖼️",
      webp: "🖼️",
      svg: "🖼️",

      mp4: "🎬",
      mov: "🎬",
      avi: "🎬",
      mkv: "🎬",

      mp3: "🎵",
      wav: "🎵",
      ogg: "🎵",

      pdf: "📕",

      doc: "📘",
      docx: "📘",

      xls: "📗",
      xlsx: "📗",

      ppt: "📙",
      pptx: "📙",

      zip: "🗜️",
      rar: "🗜️",
      "7z": "🗜️",

      txt: "📄",
      csv: "📊",

      html: "🌐",
      css: "🎨",
      js: "📜"

    };


    return (
      icons[extension] ||
      "📄"
    );

  }


  /* =====================================================
     CHECK IMAGE
  ===================================================== */

  function isImageFile(
    fileName
  ) {

    return /\.(jpg|jpeg|png|gif|webp|svg)$/i
      .test(fileName);

  }


  /* =====================================================
     GET THUMBNAIL
  ===================================================== */

  async function getThumbnailUrl(
    fileName
  ) {

    try {

      const filePath =
        `${currentUser.id}/${fileName}`;


      /*
        Gunakan signed URL biasa.
        Browser akan menampilkan thumbnail
        jika file merupakan gambar.
      */

      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .createSignedUrl(
            filePath,
            60 * 60
          );


      if (error) {

        console.error(
          "Thumbnail error:",
          error
        );

        return null;

      }


      return data?.signedUrl || null;

    } catch (error) {

      console.error(
        error
      );

      return null;

    }

  }


  /* =====================================================
     LOAD THUMBNAIL
  ===================================================== */

  async function loadThumbnail(
    imageElement,
    fileName
  ) {

    if (
      !isImageFile(
        fileName
      )
    ) {
      return;
    }


    const url =
      await getThumbnailUrl(
        fileName
      );


    if (!url) {
      return;
    }


    imageElement.src =
      url;


    imageElement.onload =
      () => {

        imageElement.classList.add(
          "loaded"
        );

      };


    imageElement.onerror =
      () => {

        imageElement.style.display =
          "none";

      };

  }


  /* =====================================================
     LOAD FILES
  ===================================================== */

  async function loadFiles() {

    if (!currentUser) {
      return;
    }


    fileList.innerHTML = `

      <div class="loading-card">

        <div class="spinner"></div>

        Memuat file...

      </div>

    `;


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .list(
          currentUser.id,
          {
            limit: 1000,

            offset: 0,

            sortBy: {
              column:
                "created_at",

              order:
                "desc"
            }
          }
        );


    if (error) {

      console.error(
        error
      );


      fileList.innerHTML = `

        <div class="bg-red-100 text-red-700 rounded-xl p-4">

          Gagal memuat file:
          ${escapeHtml(
            error.message
          )}

        </div>

      `;


      return;

    }


    allFiles =
      (data || [])
        .filter(
          file =>
            file.name !==
            ".emptyFolderPlaceholder"
        );


    renderFiles(
      allFiles
    );

  }


  /* =====================================================
     RENDER FILES
  ===================================================== */

  function renderFiles(
    files
  ) {

    fileList.innerHTML =
      "";


    fileCount.textContent =
      `${files.length} file${
        files.length !== 1
          ? "s"
          : ""
      }`;


    if (
      files.length === 0
    ) {

      emptyState.classList.remove(
        "hidden"
      );

      return;

    }


    emptyState.classList.add(
      "hidden"
    );


    files.forEach(
      file => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "file-card";


        const safeName =
          escapeHtml(
            file.name
          );


        const size =
          formatSize(
            file.metadata?.size ||
            0
          );


        const created =
          formatDate(
            file.created_at ||
            new Date()
          );


        const image =
          isImageFile(
            file.name
          );


        card.innerHTML = `

          <!-- THUMBNAIL -->

          <div class="file-thumbnail">

            ${
              image
                ? `
                  <img
                    alt="${safeName}"
                    class="thumbnail-image"
                  />
                `
                : `
                  <div class="file-icon">
                    ${getFileIcon(
                      file.name
                    )}
                  </div>
                `
            }

          </div>


          <!-- INFO -->

          <div class="file-info">

            <div
              class="file-name"
              title="${safeName}"
            >
              ${safeName}
            </div>

            <div class="file-meta">
              ${size}
              •
              ${created}
            </div>

          </div>


          <!-- ACTIONS -->

          <div class="file-actions">

            <button
              class="action-btn rename-btn"
              type="button"
            >
              ✏️ Rename
            </button>

            <button
              class="action-btn download-btn"
              type="button"
            >
              ⬇️ Download
            </button>

            <button
              class="action-btn delete-btn"
              type="button"
            >
              🗑️ Hapus
            </button>

          </div>

        `;


        /* =================================================
           THUMBNAIL
        ================================================== */

        if (image) {

          const imageElement =
            card.querySelector(
              ".thumbnail-image"
            );


          loadThumbnail(
            imageElement,
            file.name
          );

        }


        /* =================================================
           RENAME
        ================================================== */

        card
          .querySelector(
            ".rename-btn"
          )
          .addEventListener(
            "click",
            () => {

              renameFile(
                file.name
              );

            }
          );


        /* =================================================
           DOWNLOAD
        ================================================== */

        card
          .querySelector(
            ".download-btn"
          )
          .addEventListener(
            "click",
            () => {

              downloadFile(
                file.name
              );

            }
          );


        /* =================================================
           DELETE
        ================================================== */

        card
          .querySelector(
            ".delete-btn"
          )
          .addEventListener(
            "click",
            () => {

              deleteFile(
                file.name
              );

            }
          );


        fileList.appendChild(
          card
        );

      }
    );

  }


  /* =====================================================
     UPLOAD SINGLE FILE
  ===================================================== */

  async function uploadSingleFile(
    file
  ) {

    if (!currentUser) {

      throw new Error(
        "Silakan login terlebih dahulu."
      );

    }


    if (
      file.size >
      MAX_FILE_SIZE
    ) {

      throw new Error(
        `${file.name} terlalu besar. Maksimal 100 MB.`
      );

    }


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const fileName =
      `${Date.now()}_${
        Math.random()
          .toString(36)
          .slice(2, 8)
      }_${safeName}`;


    const filePath =
      `${currentUser.id}/${fileName}`;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
          filePath,
          file,
          {
            cacheControl:
              "3600",

            upsert:
              false,

            contentType:
              file.type ||
              undefined
          }
        );


    if (error) {
      throw error;
    }


    return fileName;

  }


  /* =====================================================
     MULTI UPLOAD MAX 10
  ===================================================== */

  async function uploadFiles(
    files
  ) {

    if (
      !files.length ||
      isUploading
    ) {
      return;
    }


    if (!currentUser) {

      showUploadMessage(
        "Silakan login terlebih dahulu."
      );

      return;

    }


    /*
      Batasi 10 file.
    */

    if (
      files.length >
      MAX_FILES_PER_UPLOAD
    ) {

      showUploadMessage(
        `Maksimal ${MAX_FILES_PER_UPLOAD} file sekaligus. Kamu memilih ${files.length} file.`,
        "error"
      );

      return;

    }


    isUploading =
      true;


    const total =
      files.length;


    let completed =
      0;

    let successful =
      0;

    let failed =
      0;


    const errors =
      [];


    showUploadMessage(
      `Menyiapkan ${total} file...`,
      "loading"
    );


    const validFiles =
      [];


    files.forEach(
      file => {

        if (
          file.size >
          MAX_FILE_SIZE
        ) {

          failed++;

          errors.push(
            `${file.name}: melebihi 100 MB`
          );

        } else {

          validFiles.push(
            file
          );

        }

      }
    );


    let nextIndex =
      0;


    async function worker() {

      while (true) {

        const index =
          nextIndex++;


        if (
          index >=
          validFiles.length
        ) {

          return;

        }


        const file =
          validFiles[index];


        try {

          await uploadSingleFile(
            file
          );

          successful++;


        } catch (error) {

          failed++;


          errors.push(
            `${file.name}: ${
              error.message ||
              "upload gagal"
            }`
          );


          console.error(
            `Upload gagal: ${file.name}`,
            error
          );

        } finally {

          completed++;


          showUploadMessage(
            `Mengupload... ${completed}/${validFiles.length} • ${successful} berhasil • ${failed} gagal`,
            "loading"
          );

        }

      }

    }


    const workerCount =
      Math.min(
        MAX_CONCURRENT_UPLOADS,
        validFiles.length
      );


    if (
      workerCount > 0
    ) {

      await Promise.all(

        Array.from(
          {
            length:
              workerCount
          },
          () =>
            worker()
        )

      );

    }


    const message =
      `Selesai! ${successful} berhasil • ${failed} gagal dari ${total} file.`;


    if (
      successful === 0 &&
      failed > 0
    ) {

      showUploadMessage(
        message,
        "error"
      );

    } else {

      showUploadMessage(
        message,
        "success"
      );

    }


    if (
      errors.length
    ) {

      console.warn(
        "Detail upload gagal:",
        errors
      );

    }


    await loadFiles();


    isUploading =
      false;

  }


  /* =====================================================
     FILE SELECT
  ===================================================== */

  fileInput.addEventListener(
    "change",
    async function () {

      const files =
        Array.from(
          this.files || []
        );


      if (
        !files.length
      ) {
        return;
      }


      await uploadFiles(
        files
      );


      this.value =
        "";

    }
  );


  /* =====================================================
     DRAG & DROP
  ===================================================== */

  [
    "dragenter",
    "dragover"
  ].forEach(
    eventName => {

      uploadLabel.addEventListener(
        eventName,
        event => {

          event.preventDefault();
          event.stopPropagation();


          uploadLabel.style.borderColor =
            "#3b82f6";

          uploadLabel.style.background =
            "#eff6ff";

        }
      );

    }
  );


  [
    "dragleave",
    "drop"
  ].forEach(
    eventName => {

      uploadLabel.addEventListener(
        eventName,
        event => {

          event.preventDefault();
          event.stopPropagation();


          uploadLabel.style.borderColor =
            "";

          uploadLabel.style.background =
            "";

        }
      );

    }
  );


  uploadLabel.addEventListener(
    "drop",
    async event => {

      const files =
        Array.from(
          event
            .dataTransfer
            .files || []
        );


      if (
        !files.length
      ) {
        return;
      }


      await uploadFiles(
        files
      );

    }
  );


  /* =====================================================
     RENAME
  ===================================================== */

  async function renameFile(
    oldName
  ) {

    if (!currentUser) {
      return;
    }


    const newNameInput =
      prompt(
        "Masukkan nama file baru:",
        oldName
      );


    if (
      newNameInput ===
      null
    ) {
      return;
    }


    const newName =
      newNameInput.trim();


    if (!newName) {

      alert(
        "Nama file tidak boleh kosong."
      );

      return;

    }


    if (
      newName ===
      oldName
    ) {

      return;

    }


    const safeName =
      newName.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    if (!safeName) {

      alert(
        "Nama file tidak valid."
      );

      return;

    }


    const oldPath =
      `${currentUser.id}/${oldName}`;


    const newPath =
      `${currentUser.id}/${safeName}`;


    try {

      showUploadMessage(
        `Mengganti nama ${oldName}...`,
        "loading"
      );


      /*
        Cek apakah nama baru
        sudah digunakan.
      */

      const existing =
        allFiles.some(
          file =>
            file.name ===
            safeName
        );


      if (existing) {

        showUploadMessage(
          "Nama file tersebut sudah digunakan.",
          "error"
        );

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .move(
            oldPath,
            newPath
          );


      if (error) {
        throw error;
      }


      showUploadMessage(
        `Berhasil rename menjadi ${safeName}.`,
        "success"
      );


      await loadFiles();


    } catch (error) {

      console.error(
        error
      );


      showUploadMessage(
        `Rename gagal: ${error.message}`,
        "error"
      );

    }

  }


  /* =====================================================
     DOWNLOAD
  ===================================================== */

  async function downloadFile(
    fileName
  ) {

    try {

      const filePath =
        `${currentUser.id}/${fileName}`;


      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .createSignedUrl(
            filePath,
            60 * 60
          );


      if (error) {
        throw error;
      }


      const link =
        document.createElement(
          "a"
        );


      link.href =
        data.signedUrl;


      link.target =
        "_blank";


      link.rel =
        "noopener";


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Download gagal: " +
        error.message
      );

    }

  }


  /* =====================================================
     DELETE
  ===================================================== */

  async function deleteFile(
    fileName
  ) {

    const confirmed =
      confirm(
        `Hapus file "${fileName}"?`
      );


    if (!confirmed) {
      return;
    }


    try {

      const filePath =
        `${currentUser.id}/${fileName}`;


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .remove([
            filePath
          ]);


      if (error) {
        throw error;
      }


      await loadFiles();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Gagal menghapus file: " +
        error.message
      );

    }

  }


  /* =====================================================
     SEARCH
  ===================================================== */

  searchInput.addEventListener(
    "input",
    function () {

      const keyword =
        this.value
          .toLowerCase()
          .trim();


      if (!keyword) {

        renderFiles(
          allFiles
        );

        return;

      }


      const filtered =
        allFiles.filter(
          file =>
            file.name
              .toLowerCase()
              .includes(
                keyword
              )
        );


      renderFiles(
        filtered
      );

    }
  );


  /* =====================================================
     REFRESH
  ===================================================== */

  document
    .getElementById(
      "refreshButton"
    )
    .addEventListener(
      "click",
      async () => {

        await loadFiles();

      }
    );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  supabaseClient
    .auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        if (
          session &&
          session.user
        ) {

          currentUser =
            session.user;

          await showStoragePage();

        } else {

          currentUser =
            null;

          storagePage.classList.add(
            "hidden"
          );

          authPage.classList.remove(
            "hidden"
          );

        }

      }
    );


  /* =====================================================
     START
  ===================================================== */

  loadUser();

</script>
